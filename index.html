<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 宗宗的家</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDE9;--bg2:#DAE3DB;--white:#F2F6F3;
  --sage:#5A8F69;--sage2:#7AAA87;--sage3:#B5CEB9;--sage4:#DDE8DF;
  --text:#243226;--text2:#4A5E4C;--text3:#849E87;
  --border:#BACED0;--border2:#A4BCA7;
  --blue:#5B8DD9;--blue-l:#E8F1FB;
  --red:#E05C5C;--red-l:#FDEAEA;
  --warm:#E8926A;--purple:#9B7FD4;--yellow:#C9973A;
  --gray:#8E9E90;--gray-l:#EFF3F0;
  --shadow:0 2px 10px rgba(107,158,122,.10);
  --shadow2:0 4px 20px rgba(107,158,122,.16);
  --r:14px;--rsm:9px;--rxs:6px;
}
/* ══════════════════════════════════════════════
   深色模式 - 完全獨立設計（不依賴淺色變數）
   基於 Discord/Linear 的設計語言
   背景層次: #1A1D23 → #22262D → #2B3039 → #333A44
   文字: #F0F2F5 / #9DA5B4 / #6B7280
   對比度全部 WCAG AA 以上
══════════════════════════════════════════════ */

/* ── 基底 ── */
[data-dark="1"] body{background:#1C1F23;color:#E8ECF0}
/* 深色模式 Emoji 加亮 */
[data-dark="1"] .logo-icon,
[data-dark="1"] .card-mascot,
[data-dark="1"] .nav-icon,
[data-dark="1"] .login-mascot,
[data-dark="1"] .alarm-mascot,
[data-dark="1"] .empty-icon{
  filter:brightness(1.3) saturate(1.1);
}

/* ── Sidebar ── */
[data-dark="1"] .sidebar{background:#21252B;border-right-color:#2D3340}
[data-dark="1"] .logo-text{color:#F0F2F5}
[data-dark="1"] .nav{color:#9FAAB8}
[data-dark="1"] .nav:hover{background:#2D3340;color:#E8ECF0}
[data-dark="1"] .nav.active{background:#2EB87A;color:#FFFFFF}
[data-dark="1"] #btn-darkmode{color:#9DA5B4}

/* ── 主內容背景 ── */
[data-dark="1"] .main{background:#1A1D23}
[data-dark="1"] .pt{color:#F0F2F5}

/* ── 卡片 / Panel ── */
[data-dark="1"] .pcard{background:#242830;border-color:#2D3340;color:#E8ECF0}
[data-dark="1"] .pcard:hover{border-color:#2EB87A;background:#282D36}
[data-dark="1"] .d-card,[data-dark="1"] .set-card,[data-dark="1"] .analytics-card,[data-dark="1"] .diary-item{background:#242830;border-color:#2D3340}
[data-dark="1"] .stat-card{background:#242830;border-color:#2D3340}
[data-dark="1"] .stat-label{color:#9FAAB8}

/* ── 卡片內文字 ── */
[data-dark="1"] .card-name{color:#E8ECF0}
[data-dark="1"] .card-meta{color:#9FAAB8}
[data-dark="1"] .card-meta span{color:#9FAAB8}

/* ── Badge ── */
[data-dark="1"] .badge-cert{background:#2D3340;color:#C5D0DC;border-color:#363D4A}
[data-dark="1"] .badge-attr{background:#1A2535;color:#6BA8D4;border-color:#253550}

/* ── 進度條 ── */
[data-dark="1"] .prog-track{background:#2D3340}
[data-dark="1"] .prog-label{color:#9FAAB8}
[data-dark="1"] .bar-track{background:#2D3340}
[data-dark="1"] .bar-label{color:#C5D0DC}

/* ── Filter chips ── */
[data-dark="1"] .chip{background:#242830;border-color:#363D4A;color:#9FAAB8}
[data-dark="1"] .chip:hover{border-color:#2EB87A;color:#2EB87A}
[data-dark="1"] .chip.active{background:#E8ECF0;color:#1C1F23;border-color:#E8ECF0}
[data-dark="1"] .chip-red{border-color:#C04A4A;color:#E07A7A}
[data-dark="1"] .chip-red.active{background:#C04A4A;color:#FFF}

/* ── Search & Filter inputs ── */
[data-dark="1"] .search-inp{background:#242830;border-color:#363D4A;color:#E8ECF0}
[data-dark="1"] .search-inp:focus{border-color:#2EB87A;background:#2D3340}
[data-dark="1"] .search-icon{color:#636D7D}
[data-dark="1"] .filter-sel{background:#242830;border-color:#363D4A;color:#E8ECF0}

/* ── Date group header ── */
[data-dark="1"] .dg-header{color:#636D7D}
[data-dark="1"] .dg-header::after{background:#2D3340}

/* ── Form inputs ── */
[data-dark="1"] input[type=text],[data-dark="1"] input[type=date],
[data-dark="1"] input[type=time],[data-dark="1"] input[type=number],
[data-dark="1"] select,[data-dark="1"] textarea{
  background:#242830!important;border-color:#363D4A!important;color:#E8ECF0!important;color-scheme:dark
}
[data-dark="1"] input:focus,[data-dark="1"] select:focus,[data-dark="1"] textarea:focus{
  background:#2D3340!important;border-color:#2EB87A!important
}
[data-dark="1"] .form-label{color:#C5D0DC}
[data-dark="1"] .form-stitle{color:#9FAAB8}
[data-dark="1"] .hint{color:#636D7D}

/* ── Tag options (topt) ── */
[data-dark="1"] .topt{background:#2D3340;border-color:#363D4A;color:#C5D0DC}
[data-dark="1"] .topt:hover{background:#363D4A;border-color:#2EB87A;color:#2EB87A}
[data-dark="1"] .topt.sel{background:#2EB87A!important;color:#FFFFFF!important;border-color:#2EB87A!important}

/* ── Tag pills ── */
[data-dark="1"] .tag-pill{background:#2D3340;border-color:#363D4A;color:#C5D0DC}

/* ── Modal ── */
[data-dark="1"] .modal{background:#242830}
[data-dark="1"] .modal-hdr{border-color:#2D3340}
[data-dark="1"] .modal-title{color:#E8ECF0}
[data-dark="1"] .modal-footer{border-color:#2D3340}
[data-dark="1"] .modal-close{color:#9FAAB8}
[data-dark="1"] .modal-close:hover{background:#2D3340}
[data-dark="1"] .modal-ov{background:rgba(0,0,0,.55)}

/* ── Detail view ── */
[data-dark="1"] .d-back{color:#9FAAB8}
[data-dark="1"] .d-back:hover{color:#2EB87A}
[data-dark="1"] .d-hero{border-color:#2D3340}
[data-dark="1"] .d-name{color:#E8ECF0}
[data-dark="1"] .d-tabs-wrap{border-color:#2D3340;background:#21252B}
[data-dark="1"] .d-tab{color:#9FAAB8}
[data-dark="1"] .d-tab:hover{color:#C5D0DC}
[data-dark="1"] .d-tab.active{color:#2EB87A;border-bottom-color:#2EB87A}
[data-dark="1"] .d-pane{background:#242830}

/* ── Info grid ── */
[data-dark="1"] .info-label{color:#9FAAB8}
[data-dark="1"] .info-value{color:#E8ECF0}
[data-dark="1"] .info-value:hover{background:#2D3340}

/* ── Checklist / Todo / Log / Note ── */
[data-dark="1"] .cl-item{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .cl-label{color:#E8ECF0}
[data-dark="1"] .cl-note{color:#9FAAB8}
[data-dark="1"] .cl-date{color:#2EB87A}
[data-dark="1"] .cl-check{background:#242830;border-color:#363D4A}
[data-dark="1"] .cl-check.checked{background:#2EB87A;border-color:#2EB87A}
[data-dark="1"] .todo-item{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .todo-label{color:#E8ECF0}
[data-dark="1"] .todo-dt{color:#9FAAB8}
[data-dark="1"] .todo-dt.od{color:#E07070}
[data-dark="1"] .log-item{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .log-date{color:#9FAAB8}
[data-dark="1"] .log-content{color:#E8ECF0}
[data-dark="1"] .log-tag{background:#242830;color:#C5D0DC;border-color:#363D4A}
[data-dark="1"] .note-item{background:#2D3340;border-color:#363D4A}

/* ── Contact card ── */
[data-dark="1"] .contact-card{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .contact-name{color:#E8ECF0}
[data-dark="1"] .contact-row{color:#C5D0DC}

/* ── Stage steps ── */
[data-dark="1"] .stage-step{background:#2D3340}
[data-dark="1"] .stage-lbl{color:#9FAAB8}

/* ── Settings ── */
[data-dark="1"] .set-title{color:#E8ECF0}
[data-dark="1"] .set-hint{color:#9FAAB8}
[data-dark="1"] .drag-item{background:#2D3340;border-color:#363D4A;color:#C5D0DC}
[data-dark="1"] .drag-handle{color:#636D7D}
[data-dark="1"] .tpl-card{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .tpl-name{color:#E8ECF0}
[data-dark="1"] .tpl-hint{color:#9FAAB8}
[data-dark="1"] .tpl-card:hover,[data-dark="1"] .tpl-card.sel-tpl{border-color:#2EB87A;background:#1E3028}

/* ── Rich text editor ── */
[data-dark="1"] .rte-wrap{border-color:#363D4A;background:#242830}
[data-dark="1"] .rte-toolbar{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .rte-btn{color:#C5D0DC}
[data-dark="1"] .rte-btn:hover{background:#363D4A;border-color:#363D4A}
[data-dark="1"] .rte-editor{color:#E8ECF0;background:#242830}
[data-dark="1"] .rte-editor:empty:before{color:#636D7D}

/* ── Overdue ── */
[data-dark="1"] .pcard.overdue{background:#251D1D;border-left-color:#E05050}
[data-dark="1"] .overdue-badge{background:#E05050}

/* ── Closed / Lost ── */
[data-dark="1"] .pcard.closed,[data-dark="1"] .pcard.lost{background:#1C1F23;opacity:.65}
[data-dark="1"] .sbanner-closed{background:#363D4A;color:#C5D0DC}
[data-dark="1"] .sbanner-lost{background:#242830;color:#9FAAB8;border-color:#363D4A}

/* ── Alerts ── */
[data-dark="1"] .alert-red{background:#2A1C1C;color:#E08080;border-color:#3A2424}

/* ── Diary ── */
[data-dark="1"] .diary-proj{color:#2EB87A}

/* ── Empty state ── */
[data-dark="1"] .empty-state{color:#636D7D}

/* ── Section block ── */
[data-dark="1"] .sec-block{background:#2D3340;border-color:#363D4A}
[data-dark="1"] .sec-block-title{color:#C5D0DC}

/* ── ibtn ── */
[data-dark="1"] .ibtn{color:#636D7D}
[data-dark="1"] .ibtn:hover{background:#2D3340;color:#C5D0DC}

/* ── Toggle ── */
[data-dark="1"] .toggle-track{background:#363D4A}
[data-dark="1"] .toggle-track.on{background:#2EB87A}

/* ── Login ── */
[data-dark="1"] #login-screen{background:#1C1F23}
[data-dark="1"] .login-box{background:#242830}
[data-dark="1"] .login-title{color:#E8ECF0}
[data-dark="1"] .login-sub{color:#9FAAB8}

/* ── Alarm ── */
[data-dark="1"] .alarm-popup{background:#242830;border-color:#2EB87A}
[data-dark="1"] .alarm-title{color:#E8ECF0}
[data-dark="1"] .alarm-msg{color:#C5D0DC}
[data-dark="1"] .alarm-snooze{background:#2D3340;border-color:#2EB87A;color:#2EB87A}
[data-dark="1"] .snooze-opt{background:#2D3340;border-color:#363D4A;color:#C5D0DC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);transition:background .3s;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--white);border-radius:24px;padding:2.5rem 2rem;box-shadow:var(--shadow2);width:320px;text-align:center}
.login-mascot{font-size:58px;margin-bottom:.5rem;animation:bounce 2s ease-in-out infinite}
.login-title{font-size:20px;font-weight:800;margin-bottom:.2rem}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.login-field{margin-bottom:10px;text-align:left}
.login-field label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px}
.login-field input{width:100%;padding:10px 13px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:var(--sage4)}
.login-field input:focus{outline:none;border-color:var(--sage);background:white}
.login-btn{width:100%;padding:11px;background:var(--sage);color:white;border:none;border-radius:var(--rsm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.login-btn:hover{background:var(--sage2)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}
/* LAYOUT */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--white);border-right:1.5px solid var(--border);display:flex;flex-direction:column;padding:1.2rem .9rem;z-index:100;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:1.4rem;padding:0 4px}
.logo-icon{font-size:26px;animation:float 3s ease-in-out infinite;filter:none}
.logo-text{font-size:15px;font-weight:800}
.nav{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rsm);cursor:pointer;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:3px;transition:all .15s;user-select:none}
.nav:hover{background:var(--sage4);color:var(--sage)}
.nav.active{background:var(--sage);color:white;box-shadow:0 2px 8px rgba(107,158,122,.3)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:200px;padding:1.75rem 1.75rem 4rem;max-width:1100px}
.page{display:none}.page.active{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem;flex-wrap:wrap;gap:10px}
.pt{font-size:20px;font-weight:800}
/* BUTTONS */
.btn{padding:7px 15px;border-radius:var(--rsm);border:1.5px solid var(--border2);background:var(--white);cursor:pointer;font-size:13px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--sage4)}.btn-p{background:var(--sage);color:white;border-color:var(--sage)}.btn-p:hover{background:var(--sage2)}
.btn-sm{padding:4px 11px;font-size:12px}.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--sage4)}
.btn-danger{color:var(--red);border-color:var(--red)}.btn-danger:hover{background:var(--red-l)}
/* INPUTS */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel],select,textarea{
  padding:8px 11px;border-radius:var(--rxs);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--sage4);color:var(--text);width:100%;position:relative;z-index:10}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage);background:white}
textarea{resize:vertical;min-height:140px}
.form-section{margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px dashed var(--border);overflow:visible}
.form-section:last-child{border-bottom:none;margin-bottom:0}
.form-stitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.form-row{margin-bottom:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px}
/* TAGS - the core interactive element */
.tag-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.topt{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.topt:hover{border-color:var(--sage);color:var(--sage);background:var(--sage4)}
.topt.sel{background:var(--sage)!important;color:white!important;border-color:var(--sage)!important}
.topt-rm{font-size:10px;opacity:0;transition:opacity .15s;cursor:pointer;line-height:1}
.topt:hover .topt-rm{opacity:.6}
.topt.sel .topt-rm{opacity:.8;color:rgba(255,255,255,.9)}
.topt-rm:hover{opacity:1!important;color:var(--red)!important}
.topt.sel .topt-rm:hover{color:rgba(255,255,255,1)!important}
.add-row{display:flex;gap:6px;margin-top:6px}.add-row input{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:3px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-cert{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.badge-attr{background:var(--blue-l);color:var(--blue);border:1px solid #c5d8ef;font-size:10px}
/* FILTER */
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem}
.chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s;white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--sage);color:var(--sage)}.chip.active{background:var(--text);color:white;border-color:var(--text)}
.chip-red{border-color:var(--red);color:var(--red)}.chip-red.active{background:var(--red);color:white}
.search-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3)}
.search-inp{width:100%;padding:8px 11px 8px 32px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--white)}
.search-inp:focus{outline:none;border-color:var(--sage)}
.filter-sel{padding:8px 11px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--white);cursor:pointer}
/* DATE GROUP */
.dg-header{font-size:12px;font-weight:800;color:var(--text3);letter-spacing:.07em;margin:1.2rem 0 .7rem;display:flex;align-items:center;gap:8px}
.dg-header::after{content:'';flex:1;height:1px;background:var(--border)}
/* PROJECT CARDS */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px}
.pcard{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:.95rem 1rem;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow2)}
.pcard.overdue{border-left:4px solid var(--red);background:linear-gradient(135deg,#fff5f5 0%,#ffffff 100%)}
.pcard.overdue::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,var(--red) 0px,var(--red) 8px,transparent 8px,transparent 16px)}
.overdue-badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:white;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;animation:wiggle .6s ease-in-out infinite;margin-top:4px}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}.pcard.closed{opacity:.70;background:var(--gray-l)}.pcard.lost{border-left:4px solid var(--gray);background:var(--gray-l)}
.card-mascot{position:absolute;top:9px;right:9px;font-size:19px;cursor:pointer;transition:transform .3s;user-select:none}
.pcard:hover .card-mascot{transform:rotate(15deg) scale(1.2)}
.card-del{position:absolute;top:7px;right:36px;font-size:12px;cursor:pointer;opacity:0;transition:opacity .2s;background:var(--red-l);border:none;border-radius:4px;color:var(--red);padding:2px 5px;font-weight:700}
.pcard:hover .card-del{opacity:1}
.card-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:5px;padding-right:58px;line-height:1.4}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.prog-track{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-label{font-size:10px;color:var(--text3);display:flex;justify-content:space-between}
.card-meta{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.card-todo{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.ctodo-item{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.ctodo-dot{width:5px;height:5px;border-radius:50%;background:var(--sage3);flex-shrink:0}
.card-attrs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sbanner{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--rxs);display:inline-flex;align-items:center;gap:4px;margin-top:3px}
.sbanner-closed{background:var(--gray);color:white}.sbanner-lost{background:var(--gray-l);color:var(--gray);border:1px solid var(--gray)}
/* STATS */
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px;margin-bottom:1.4rem}
.stat-card{background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:13px;text-align:center}
.stat-num{font-size:23px;font-weight:800}.stat-label{font-size:11px;color:var(--text3);font-weight:700;margin-top:2px}
.alert-banner{border-radius:var(--rsm);padding:11px 15px;margin-bottom:1rem;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.alert-red{background:var(--red-l);color:var(--red);border:1.5px solid #f5b8b8}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(44,58,46,.35);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.modal-ov.open{display:flex}
.modal{background:var(--white);border-radius:var(--r);width:100%;max-width:640px;box-shadow:var(--shadow2)}
.modal-hdr{padding:1.1rem 1.4rem .9rem;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:800}
.modal-close{background:none;border:none;font-size:19px;cursor:pointer;color:var(--text3);padding:2px 5px;border-radius:5px}
.modal-close:hover{background:var(--sage4)}
.modal-body{padding:1.1rem 1.4rem;max-height:70vh;overflow-y:auto;overflow-x:visible}
.modal-footer{padding:.9rem 1.4rem;border-top:1.5px solid var(--border);display:flex;gap:7px;justify-content:flex-end}
/* DETAIL */
.d-back{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;font-weight:700;padding:0;margin-bottom:.9rem;font-family:inherit}
.d-back:hover{color:var(--sage)}
.d-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.d-hero{padding:1.3rem;border-bottom:1.5px solid var(--border)}
.d-name{font-size:19px;font-weight:800;margin-bottom:7px}
.d-tabs-wrap{border-bottom:1.5px solid var(--border);overflow-x:auto;user-select:none}
.d-tabs{display:flex;min-width:max-content}
.d-tab{padding:10px 14px;border:none;background:transparent;cursor:grab;font-size:13px;font-weight:700;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:inherit;white-space:nowrap;transition:all .15s}
.d-tab:hover{color:var(--sage)}.d-tab.active{color:var(--sage);border-bottom-color:var(--sage)}
.d-tab.dragging{opacity:.4;cursor:grabbing}.d-tab.drag-over{border-left:2px solid var(--sage)}
.d-pane{padding:1.1rem 1.4rem;display:none}.d-pane.active{display:block}
.stage-steps{display:flex;gap:3px;margin:7px 0 2px}.stage-step{flex:1;height:5px;border-radius:3px}
.stage-labels{display:flex;gap:3px;margin-bottom:7px}
.stage-lbl{flex:1;font-size:10px;text-align:center;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-lbl.cur{font-weight:800}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:8px}
.info-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:2px}
.info-value{font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px}
.info-value:hover{background:var(--sage4)}
.contact-card{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:11px}
.contact-name{font-size:14px;font-weight:800;margin-bottom:5px}
.contact-row{font-size:12px;color:var(--text2);margin-bottom:3px}
.log-item{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:7px}
.log-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.log-date{font-size:11px;color:var(--text3);font-weight:700}
.log-content{font-size:13px;line-height:1.6}
.log-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.log-tag{background:var(--white);color:var(--text2);padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border)}
/* CHECKLIST */
.cl-section{margin-bottom:1.1rem}
.cl-stitle{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.cl-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;background:var(--sage4);border-radius:var(--rxs);border:1.5px solid var(--border);margin-bottom:5px}
.cl-item.done{opacity:.6}.cl-item.done .cl-label{text-decoration:line-through;color:var(--text3)}
.cl-check{width:17px;height:17px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:white;margin-top:1px;transition:all .15s}
.cl-check.checked{background:var(--sage);border-color:var(--sage);color:white}
.cl-body{flex:1}.cl-label{font-size:13px;font-weight:600}
.cl-note{font-size:11px;color:var(--text3);margin-top:2px}.cl-date{font-size:11px;color:var(--sage);font-weight:700;margin-top:2px}
/* TODOS */
.todo-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border-radius:var(--rxs);border:1.5px solid var(--border);margin-bottom:5px}
.todo-label{flex:1;font-size:13px;font-weight:600}.todo-dt{font-size:11px;color:var(--text3)}.todo-dt.od{color:var(--red);font-weight:700}
/* NOTES */
.note-item{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:7px}
.note-hdr{display:flex;justify-content:space-between;margin-bottom:5px}
.note-files{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.thumb{width:65px;height:65px;border-radius:7px;object-fit:cover;border:1.5px solid var(--border);cursor:pointer}
.file-chip{display:flex;align-items:center;gap:4px;padding:5px 9px;background:var(--white);border-radius:6px;border:1.5px solid var(--border);font-size:12px;cursor:pointer}
/* SETTINGS */
.set-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:1.1rem 1.4rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.set-title{font-size:14px;font-weight:800;margin-bottom:3px}.set-hint{font-size:12px;color:var(--text3);margin-bottom:11px}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:var(--sage4);border:1.5px solid var(--border);font-size:12px;font-weight:700;margin:3px}
.pill-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:0}.pill-rm:hover{color:var(--red)}
.drag-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border:1.5px solid var(--border);border-radius:var(--rxs);margin-bottom:5px;cursor:grab;user-select:none}
.drag-handle{color:var(--text3);font-size:15px}.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tpl-card{background:var(--sage4);border-radius:var(--rsm);border:1.5px solid var(--border);padding:11px 13px;margin-bottom:7px;transition:all .15s}
.tpl-card:hover,.tpl-card.sel-tpl{border-color:var(--sage)}.tpl-card.sel-tpl{background:#EDF5EF}
.tpl-name{font-size:13px;font-weight:800}.tpl-hint{font-size:11px;color:var(--text3);margin-top:2px}
/* DIARY / STATS */
.diary-item{background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:11px 13px;margin-bottom:7px}
.diary-proj{font-size:12px;font-weight:800;color:var(--sage);margin-bottom:3px;cursor:pointer}.diary-proj:hover{text-decoration:underline}
.analytics-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:1.1rem 1.4rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.analytics-title{font-size:14px;font-weight:800;margin-bottom:.9rem}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.bar-label{font-size:12px;font-weight:700;color:var(--text2);min-width:90px;text-align:right}
.bar-track{flex:1;height:19px;background:var(--bg2);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;display:flex;align-items:center;padding-left:7px;transition:width .5s}
.bar-val{font-size:11px;font-weight:800;color:white}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3)}.empty-icon{font-size:44px;margin-bottom:7px}
.ibtn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px 5px;border-radius:4px;font-family:inherit}
.ibtn:hover{background:var(--sage4);color:var(--text)}
/* STAGE ITEMS */
.proj-stage-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border:1.5px solid var(--border);border-radius:var(--rxs);margin-bottom:5px;cursor:grab;user-select:none}
.proj-stage-item.drag-over{border-top:2px solid var(--sage)}
.editable-inline{border:none;background:transparent;font-size:inherit;font-weight:inherit;font-family:inherit;color:inherit;padding:2px 4px;border-radius:4px;width:100%}
.editable-inline:focus{outline:1.5px solid var(--sage);background:white}
/* SECTION BLOCKS */
.sec-block{background:var(--sage4);border-radius:var(--rsm);border:1.5px solid var(--border);padding:10px 13px;margin-bottom:8px}
.sec-block-title{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
/* TOGGLE */
.toggle-track{width:32px;height:18px;border-radius:9px;background:var(--border2);position:relative;transition:background .2s;cursor:pointer;flex-shrink:0}
.toggle-track.on{background:var(--sage)}
.toggle-knob{width:14px;height:14px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-track.on .toggle-knob{left:16px}
/* ALARM */
#alarm-container{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column-reverse;gap:9px;max-width:320px;pointer-events:none}
.alarm-popup{background:var(--white);border-radius:var(--r);border:2px solid var(--sage);box-shadow:var(--shadow2);width:310px;animation:slideUp .3s ease;overflow:hidden;pointer-events:all}
.alarm-top{background:linear-gradient(135deg,var(--sage),var(--sage2));padding:14px 15px 10px;text-align:center;overflow:visible}
.alarm-mascot{font-size:42px;display:block;animation:bounce .8s ease-in-out infinite;line-height:1.2;margin:4px auto}
.alarm-body{padding:12px 15px;background:var(--white)}
.alarm-title{font-size:13px;font-weight:800;margin-bottom:5px}
.alarm-msg{font-size:12px;color:var(--text2);margin-bottom:9px;line-height:1.5}
.alarm-btns{display:flex;gap:5px}
.alarm-ok{flex:1;padding:7px;background:var(--sage);color:white;border:none;border-radius:var(--rxs);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.alarm-snooze{flex:1;padding:7px;background:var(--sage4);color:var(--sage);border:1.5px solid var(--sage);border-radius:var(--rxs);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.snooze-panel{display:none;margin-top:7px;flex-wrap:wrap;gap:4px}
.snooze-opt{padding:3px 9px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:11px;font-weight:700;color:var(--text2);font-family:inherit}
.snooze-opt:hover{border-color:var(--sage);color:var(--sage)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:11px}
#lb-close{position:absolute;top:15px;right:22px;color:white;font-size:30px;cursor:pointer;background:none;border:none}
/* ANIMATIONS */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* RICH TEXT EDITOR */
.rte-wrap{border:1.5px solid var(--border);border-radius:var(--rxs);background:var(--sage4);overflow:hidden}
.rte-wrap:focus-within{border-color:var(--sage);background:white}
.rte-toolbar{display:flex;gap:2px;padding:5px 7px;border-bottom:1px solid var(--border);background:var(--white);flex-wrap:wrap}
.rte-btn{padding:3px 7px;border:1.5px solid transparent;border-radius:4px;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text2);line-height:1;transition:all .15s}
.rte-btn:hover{background:var(--sage4);border-color:var(--border)}
.rte-btn.active{background:var(--sage);color:white;border-color:var(--sage)}
.rte-btn.bold{font-weight:800}
.rte-btn.italic{font-style:italic}
.rte-btn.underline{text-decoration:underline}
.rte-colors{display:flex;gap:3px;align-items:center;margin-left:4px;padding-left:6px;border-left:1px solid var(--border)}
.rte-color{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.rte-color:hover,.rte-color.active{border-color:var(--text);transform:scale(1.2)}
.rte-editor{min-height:120px;padding:9px 11px;font-size:13px;font-family:'Nunito','Noto Sans TC',sans-serif;line-height:1.7;outline:none;color:var(--text)}
.rte-editor:empty:before{content:attr(data-placeholder);color:var(--text3)}
</style>
</head>

const isOD=(d,t)=>{
  if(!d||!d.trim())return false;
  if(d<TODAY)return true;  // 日期已過
  if(d===TODAY&&t&&t.trim()){
    // 同一天但時間已過
    const now=new Date();
    const [h,m]=(t||'').split(':').map(Number);
    const target=new Date();target.setHours(h||0,m||0,0,0);
    return now>target;
  }
  return false;
};

// Get effective sections for a project
function getEffSecs(p){
  if(p.projSections&&p.projSections.length)return p.projSections;
  const tpl=getTpl(p.templateId);
  return JSON.parse(JSON.stringify(tpl?.sections||DEFAULT_TPL_SECTIONS));
}

// Get effective stage IDs for a project
function getProjStageIds(p){
  if(p.projStageIds&&p.projStageIds.length)return p.projStageIds;
  const tpl=getTpl(p.templateId);
  return tpl?.stageIds||DEFAULT_STAGES.filter(s=>s.name!=='完成').map(s=>s.id);
}

function getProjStages(p){
  return getProjStageIds(p).map(id=>stageById(id)).filter(Boolean);
}

function renderRevenuePage(){
  const selYear=document.getElementById('rev-year')?.value||'';
  const selMonth=document.getElementById('rev-month')?.value||'';
  const selStatus=document.getElementById('rev-status')?.value||'';
  let projs=G.projects.filter(p=>{
    if(selYear&&String(p.year||new Date().getFullYear())!==selYear)return false;
    if(selMonth&&String(p.month||1)!==selMonth)return false;
    if(selStatus&&p.status!==selStatus)return false;
    return true;
  });
  const getAmt=p=>{
    if(p.certPrices&&p.certPrices.length>0)return p.certPrices.reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0);
    return parseFloat(String(p.price||'0').replace(/,/g,''))||0;
  };
  const fmtN=n=>n>=10000?(n/10000).toFixed(1)+'萬':n.toLocaleString();
  const totalAmt=projs.reduce((s,p)=>s+getAmt(p),0);
  const activeAmt=projs.filter(p=>p.status==='active').reduce((s,p)=>s+getAmt(p),0);
  const closedAmt=projs.filter(p=>p.status==='closed').reduce((s,p)=>s+getAmt(p),0);
  const lostAmt=projs.filter(p=>p.status==='lost').reduce((s,p)=>s+getAmt(p),0);
  const chartYear=parseInt(selYear)||new Date().getFullYear();
  const monthlyData=Array.from({length:12},(_,i)=>{
    const m=i+1;
    const ps=G.projects.filter(p=>(p.year||new Date().getFullYear())===chartYear&&(p.month||1)===m);
    return{month:m,amount:ps.reduce((s,p)=>s+getAmt(p),0),count:ps.length};
  });
  if(!G.revenueBaselines)G.revenueBaselines=Array(12).fill(0);
  const bls=G.revenueBaselines;
  const maxVal=Math.max(...monthlyData.map(d=>d.amount),...bls,100000);
  // Build SVG chart
  const W=560,H=200,pl=65,pr=15,pt=20,pb=40;
  const cW=W-pl-pr,cH=H-pt-pb;
  const cx=i=>pl+i*(cW/11);
  const cy=v=>pt+cH-(v/maxVal*cH);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
  // Grid
  [0.25,0.5,0.75,1].forEach(r=>{
    const yv=pt+cH-r*cH;
    svg+='<line x1="'+pl+'" y1="'+yv+'" x2="'+(W-pr)+'" y2="'+yv+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>';
    svg+='<text x="'+(pl-5)+'" y="'+(yv+4)+'" text-anchor="end" font-size="10" fill="var(--text3)">'+fmtN(maxVal*r)+'</text>';
  });
  // Bars
  monthlyData.forEach((d,i)=>{
    const bl=bls[i]||0;
    const color=d.amount>0&&d.amount>=bl?'var(--sage)':'var(--red)';
    const bH=Math.max(2,d.amount/maxVal*cH);
    svg+='<rect x="'+(cx(i)-11)+'" y="'+cy(d.amount)+'" width="22" height="'+bH+'" fill="'+color+'" opacity=".25" rx="3"/>';
    svg+='<text x="'+cx(i)+'" y="'+(H-pb+14)+'" text-anchor="middle" font-size="10" fill="var(--text3)">'+(i+1)+'月</text>';
    if(d.amount>0)svg+='<text x="'+cx(i)+'" y="'+(cy(d.amount)-5)+'" text-anchor="middle" font-size="9" fill="'+color+'" font-weight="700">'+fmtN(d.amount)+'</text>';
  });
  // Baseline polyline
  const blPts=bls.map((_,i)=>cx(i)+','+cy(bls[i])).join(' ');
  svg+='<polyline points="'+blPts+'" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,3" opacity=".8"/>';
  // Actual polyline
  const aPts=monthlyData.map((_,i)=>cx(i)+','+cy(monthlyData[i].amount)).join(' ');
  svg+='<polyline points="'+aPts+'" fill="none" stroke="var(--sage)" stroke-width="2.5"/>';
  // Dots
  monthlyData.forEach((d,i)=>{
    const bl=bls[i]||0;
    const color=d.amount>0&&d.amount>=bl?'var(--sage)':'var(--red)';
    svg+='<circle cx="'+cx(i)+'" cy="'+cy(d.amount)+'" r="4" fill="'+color+'" stroke="white" stroke-width="1.5"/>';
  });
  // Axes
  svg+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="var(--border2)" stroke-width="1.5"/>';
  svg+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(H-pb)+'" stroke="var(--border2)" stroke-width="1.5"/>';
  svg+='</svg>';
  // Legend
  const legend='<div style="display:flex;gap:16px;font-size:11px;color:var(--text3);margin-bottom:8px">'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:20px;height:3px;background:var(--sage);display:inline-block"></span>實際報價</span>'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:20px;height:2px;border-top:2px dashed var(--red);display:inline-block"></span>目標基準</span>'
    +'<span style="color:var(--sage)">■ 達標</span> <span style="color:var(--red)">■ 未達標</span></div>';
  // Project rows
  let projRows='';
  [...projs].sort((a,b)=>getAmt(b)-getAmt(a)).forEach(p=>{
    const amt=getAmt(p);
    let cpRows='';
    (p.certPrices||[]).forEach(cp=>{
      const cpAmt=parseFloat(String(cp.amount||'0').replace(/,/g,''))||0;
      cpRows+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);padding:2px 0 2px 14px">'
        +'<span>└ '+escH(cp.certName||'')+'</span><span>NT$ '+cpAmt.toLocaleString()+'</span></div>';
    });
    projRows+='<div style="background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:10px 13px;margin-bottom:7px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-size:13px;font-weight:800;cursor:pointer;color:var(--text)" onclick="goPage(\'projects\');openProject('+p.id+')">'+escH(p.name)+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+(p.year||'')+'年'+(p.month||'')+'月 · '+escH(stageById(p.stage).name)+' · '+(p.status==='closed'?'✅ 結案':p.status==='lost'?'❌ 流標':'🌱 進行中')+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:var(--sage)">NT$ '+amt.toLocaleString()+'</div>'
      +'<button class="btn btn-sm btn-ghost" style="font-size:11px;margin-top:3px" onclick="openCertPrices('+p.id+')">✏️ 分項報價</button></div>'
      +'</div>'+cpRows+'</div>';
  });
  if(!projRows)projRows='<div class="empty-state"><div class="empty-icon">💰</div><p>無符合條件的專案</p></div>';
  // Render
  const el=document.getElementById('rev-content');if(!el)return;
  el.innerHTML=''
    +'<div class="stat-row">'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--blue)">NT$ '+fmtN(totalAmt)+'</div><div class="stat-label">📊 篩選總報價</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--sage)">NT$ '+fmtN(activeAmt)+'</div><div class="stat-label">🌱 進行中</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--gray)">NT$ '+fmtN(closedAmt)+'</div><div class="stat-label">✅ 結案</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--red)">NT$ '+fmtN(lostAmt)+'</div><div class="stat-label">❌ 流標</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+projs.length+'</div><div class="stat-label">📋 專案數</div></div>'
    +'</div>'
    +'<div class="analytics-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<div class="analytics-title" style="margin-bottom:0">📈 月度報價趨勢（'+chartYear+'年）</div>'
    +'<button class="btn btn-sm" onclick="openBaselineEditor()">⚙️ 設定月目標</button></div>'
    +legend+svg+'</div>'
    +'<div class="analytics-card"><div class="analytics-title">💰 專案報價明細</div>'+projRows+'</div>';
}

function openBaselineEditor(){
  if(!G.revenueBaselines)G.revenueBaselines=Array(12).fill(0);
  const bls=G.revenueBaselines;
  let rows='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px">';
  bls.forEach((v,i)=>{
    rows+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">'
      +'<label class="form-label" style="width:36px;flex-shrink:0">'+(i+1)+'月</label>'
      +'<input type="text" id="bl-'+i+'" value="'+(v>0?v.toLocaleString():'')+'" placeholder="目標金額">'
      +'</div>';
  });
  rows+='</div>';

  ()=>{

function openCertPrices(pid){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.certPrices)p.certPrices=[];
  const secs=getEffSecs(p);
  const certSec=secs.find(s=>s.id==='sec-certs');
  const selCerts=Array.isArray(p.sectionData?.['sec-certs'])?p.sectionData['sec-certs']:[];
  const buildRows=()=>{
    let h='';
    (p.certPrices||[]).forEach((cp,i)=>{
      h+='<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px">'
        +'<input type="text" id="cpn-'+i+'" value="'+escH(cp.certName||'')+'" placeholder="認證名稱">'
        +'<input type="text" id="cpa-'+i+'" value="'+(cp.amount||'')+'" placeholder="金額（NT$）">'
        +'<button class="btn btn-sm btn-danger" onclick="rmCertPrice('+pid+','+i+')">✕</button></div>';
    });
    return h;
  };
  let quickAdd='';
  if(selCerts.length){
    quickAdd='<div class="hint" style="margin-bottom:5px">快速新增：</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">';
    selCerts.forEach(cert=>{quickAdd+='<button class="btn btn-sm" onclick="quickAddCertPrice('+pid+',\''+escH(cert)+'\')">'+escH(cert)+' ＋</button>';});
    quickAdd+='</div>';
  }
  const body=quickAdd
    +'<div id="cp-list">'+buildRows()+'</div>'
    +'<div class="add-row" style="margin-top:8px">'
    +'<input type="text" id="new-cpn" placeholder="認證名稱（例：LEED）">'
    +'<input type="text" id="new-cpa" placeholder="金額" style="width:110px">'
    +'<button class="btn btn-sm btn-p" onclick="addCertPrice('+pid+')">＋</button></div>';
  openModal(escH(p.name)+' - 分項報價',body,()=>{
    (p.certPrices||[]).forEach((cp,i)=>{
      cp.certName=document.getElementById('cpn-'+i)?.value||cp.certName;
      cp.amount=document.getElementById('cpa-'+i)?.value||cp.amount;
    });
    const total=(p.certPrices||[]).reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0);
    if(total>0)p.price=total.toLocaleString();
    save();closeModal();renderRevenuePage();
  });
}

function saveCertInputs(p){
  (p.certPrices||[]).forEach((cp,i)=>{
    const n=document.getElementById('cpn-'+i);const a=document.getElementById('cpa-'+i);
    if(n)cp.certName=n.value;if(a)cp.amount=a.value;
  });
}

function quickAddCertPrice(pid,cert){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  saveCertInputs(p);
  if(!p.certPrices)p.certPrices=[];
  if(!p.certPrices.some(cp=>cp.certName===cert))p.certPrices.push({id:'cp'+Date.now(),certName:cert,amount:'',note:''});
  closeModal();openCertPrices(pid);
}

function addCertPrice(pid){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  const name=document.getElementById('new-cpn')?.value?.trim();
  const amt=document.getElementById('new-cpa')?.value?.trim()||'';
  if(!name)return;
  saveCertInputs(p);
  if(!p.certPrices)p.certPrices=[];
  p.certPrices.push({id:'cp'+Date.now(),certName:name,amount:amt,note:''});
  closeModal();openCertPrices(pid);
}

function rmCertPrice(pid,i){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  saveCertInputs(p);p.certPrices.splice(i,1);
  closeModal();openCertPrices(pid);
}

// ── TODAY VIEW ────────────────────────────────────────
function renderToday(){
  const now=new Date();
  const todayStr=TODAY;
  const items=[];

  G.projects.filter(p=>p.status==='active').forEach(p=>{
    // Project followup today or overdue
    if(p.followup&&(p.followup<todayStr||(p.followup===todayStr&&isOD(p.followup,p.followupTime)))){
      items.push({type:'project',proj:p,label:'📋 專案追蹤',date:p.followup,time:p.followupTime||'',overdue:isOD(p.followup,p.followupTime),pid:p.id});
    }
    // Todos today or overdue
    (p.todos||[]).filter(t=>!t.done&&t.followup&&(t.followup<todayStr||(t.followup===todayStr&&isOD(t.followup,t.followupTime)))).forEach(t=>{
      items.push({type:'todo',proj:p,label:t.label,date:t.followup,time:t.followupTime||'',overdue:isOD(t.followup,t.followupTime),pid:p.id,tid:t.id});
    });
  });

  // Sort: overdue first, then by time
  items.sort((a,b)=>{
    if(a.overdue&&!b.overdue)return -1;
    if(!a.overdue&&b.overdue)return 1;
    return (a.date+a.time).localeCompare(b.date+b.time);
  });

  const overdue=items.filter(i=>i.overdue);
  const today=items.filter(i=>!i.overdue);

  let h='';

  // Summary cards
  h+=`<div class="stat-row" style="margin-bottom:1.2rem">
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${overdue.length}</div><div class="stat-label">⚠️ 逾期未處理</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--sage)">${today.length}</div><div class="stat-label">☀️ 今日待辦</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--blue)">${G.projects.filter(p=>p.status==='active').length}</div><div class="stat-label">🌱 進行中專案</div></div>
  </div>`;

  if(overdue.length){
    h+=`<div style="font-size:12px;font-weight:800;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:6px">⚠️ 逾期未處理<span style="flex:1;height:1px;background:var(--red-l);display:inline-block"></span></div>`;
    overdue.forEach(item=>h+=todayItemHTML(item));
  }

  if(today.length){
    h+=`<div style="font-size:12px;font-weight:800;color:var(--sage);margin:14px 0 8px;display:flex;align-items:center;gap:6px">☀️ 今天要做的<span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>`;
    today.forEach(item=>h+=todayItemHTML(item));
  }

  if(!items.length){
    h+=`<div class="empty-state"><div class="empty-icon">🎉</div><p>今天沒有待辦事項！<br><small style="color:var(--text3)">好好休息或提早準備明天的工作</small></p></div>`;
  }

  document.getElementById('today-content').innerHTML=h;
  // Bind click to open project
  document.querySelectorAll('[data-open-proj]').forEach(el=>{
    el.addEventListener('click',()=>{goPage('projects');openProject(parseInt(el.dataset.openProj));});
  });
  // Bind todo done
  document.querySelectorAll('[data-done-todo]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const pid=parseInt(el.dataset.pid);
      const tid=el.dataset.tid;
      const p=G.projects.find(x=>x.id===pid);
      const t=p?.todos?.find(x=>x.id===tid);
      if(!t)return;
      openModal('確認完成日期',`<div class="form-row"><label class="form-label">完成日期</label><input type="date" id="td-done-date" value="${TODAY}"></div>`,
      ()=>{t.done=true;t.doneDate=document.getElementById('td-done-date').value||TODAY;save();closeModal();renderToday();});
    });
  });
}

function exportData(){
  const data=JSON.stringify(G,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`worknest-backup-${TODAY}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.projects||!data.stages)return alert('檔案格式不正確，請確認是 WorkNest 的備份檔');
      if(!confirm(`確定要匯入？這會覆蓋目前所有資料（共 ${data.projects.length} 個專案）`))return;
      G=data;save();
      alert('匯入成功！');
      location.reload();
    }catch(err){alert('匯入失敗：'+err.message);}
  };
  reader.readAsText(file);
  input.value='';
}

// ── RENDER PROJECTS ───────────────────────────────
function renderProjects(){
  const search=(document.getElementById('proj-search').value||'').toLowerCase();
  const fy=document.getElementById('filter-year').value,fm=document.getElementById('filter-month').value;
  let list=G.projects.filter(p=>{
    if(search){
      const sd=p.sectionData||{};
      const contactData=typeof sd['sec-contacts']==='object'?sd['sec-contacts']:{};
      const contactText=Object.values(contactData).map(d=>Object.values(d||{}).join(' ')).join(' ').toLowerCase();
      const logText=p.logs.map(l=>l.content).join(' ').toLowerCase();
      const inName=p.name.toLowerCase().includes(search);
      const inContact=contactText.includes(search);
      const inLogs=logText.includes(search);
      if(!inName&&!inContact&&!inLogs)return false;
    }
    if(fy&&String(p.year||new Date().getFullYear())!==fy)return false;
    if(fm&&String(p.month||1)!==fm)return false;
    if(activeFilter==='全部')return true;
    if(activeFilter==='overdue')return isOD(p.followup)&&p.status==='active';
    if(activeFilter==='closed')return p.status==='closed';
    if(activeFilter==='lost')return p.status==='lost';
    return p.stage===activeFilter;
  });
  if(!list.length){document.getElementById('projects-container').innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><p>沒有符合的專案</p></div>';return;}
  const groups={};
  list.forEach(p=>{const k=`${p.year||new Date().getFullYear()}-${String(p.month||1).padStart(2,'0')}`;(groups[k]=groups[k]||[]).push(p);});
  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(k=>{
    const[y,m]=k.split('-');
    html+=`<div class="dg-header">📅 ${y}年 ${MONTHS[parseInt(m)]}</div><div class="proj-grid">`;
    groups[k].forEach(p=>html+=cardHTML(p));
    html+=`</div>`;
  });
  document.getElementById('projects-container').innerHTML=html;
  document.querySelectorAll('.pcard').forEach(el=>el.addEventListener('click',()=>openProject(parseInt(el.dataset.id))));
  document.querySelectorAll('.card-mascot').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();cycleMascot(parseInt(el.dataset.id));}));
  document.querySelectorAll('.card-del').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();deleteProject(parseInt(el.dataset.id));}));
}

  const certSec=secs.find(s=>s.id==='sec-certs');

  const selCerts=Array.isArray(p.sectionData?.['sec-certs'])?p.sectionData['sec-certs']:[];
  const todos=(p.todos||[]).filter(t=>!t.done).slice(0,2);
  // Custom multiselect sections for card display
  const customMSSecs=secs.filter(s=>s.type==='multiselect'&&s.id!=='sec-attrs'&&s.id!=='sec-certs'&&s.enabled!==false);

    <button class="card-del" data-id="${p.id}" title="刪除專案">🗑️</button>
    <div class="card-mascot" data-id="${p.id}">${p.mascot||'🐾'}</div>
    <div class="card-name">${escH(p.name)}</div>
    <div class="card-badges">
      <span class="badge" style="background:${st.color}22;color:${st.color}">${escH(st.name)}</span>
      ${certSec&&certSec.enabled!==false?selCerts.slice(0,2).map(c=>`<span class="badge badge-cert">${escH(c)}</span>`).join(''):''}
    </div>
    ${attrSec&&attrSec.enabled!==false&&selAttrs.length?`<div class="card-attrs">${selAttrs.slice(0,3).map(a=>`<span class="badge badge-attr">${escH(a)}</span>`).join('')}</div>`:''}
    <div class="prog-track" style="margin-top:5px"><div class="prog-fill" style="width:${pct}%;background:${st.color}"></div></div>
    <div class="prog-label"><span>${escH(st.name)}</span><span style="font-weight:800;color:${st.color}">${pct}%</span></div>
    
    ${sb}
    ${ov?`<div class="overdue-badge">🐾 追蹤日期已到！快去處理我！</div>`:''}
    <div class="card-meta">
      ${p.followup?`<span style="${ov?'color:var(--red);font-weight:700':''}">📅 ${p.followup}${p.followupTime?' '+p.followupTime:''}${ov?' ⏰':''}</span>`:''}
      ${p.price?`<span>💰 NT$${escH(p.price)}</span>`:''}
      ${p.source?`<span>👥 ${escH(p.source)}</span>`:''}
    </div>
    ${todos.length?`<div class="card-todo">${todos.map(t=>`<div class="ctodo-item"><span class="ctodo-dot"></span><span>${escH(t.label)}</span>${t.followup?`<span style="margin-left:auto;font-size:10px;color:${isOD(t.followup,t.followupTime)&&!t.done?'var(--red)':'var(--text3)'}">${t.followup}</span>`:''}</div>`).join('')}</div>`:''}
  </div>`;
}

function cycleMascot(id){const p=G.projects.find(x=>x.id===id);if(!p)return;p.mascot=MASCOTS[(MASCOTS.indexOf(p.mascot)+1)%MASCOTS.length];save();renderProjects();}
function deleteProject(id){
  const p=G.projects.find(x=>x.id===id);if(!p)return;
  if(!confirm(`確定要刪除「${p.name}」？此操作無法復原。`))return;

}

// ── DETAIL ────────────────────────────────────────
let curPid=null,curDTab='info';
function openProject(id){curPid=id;curDTab='info';document.getElementById('list-view').style.display='none';document.getElementById('detail-view').style.display='block';renderDetail();}
function showList(){document.getElementById('list-view').style.display='block';document.getElementById('detail-view').style.display='none';}

const TAB_DEF={info:'📄 資訊',contacts:'👤 聯絡人',stages:'🗂️ 階段',checklist:'✅ 清單',todos:'📌 待辦',logs:'📝 日誌',notes:'🗒️ 備註'};

function renderDetail(){
  const p=G.projects.find(x=>x.id===curPid);if(!p)return;
  const st=stageById(p.stage);
  const ps=getProjStages(p),idx=ps.findIndex(s=>s.id===p.stage);
  const pct=ps.length?Math.round(((idx+1)/ps.length)*100):0;
  const secs=getEffSecs(p);
  const tabOrder=G.tabOrder||Object.keys(TAB_DEF);
  // Build extra tabs from custom sections
  const customTabs=secs.filter(s=>s.type==='multiselect'&&s.id!=='sec-attrs'&&s.id!=='sec-certs'&&s.enabled!==false)
    .map(s=>s.id);
  const customKVTabs=secs.filter(s=>s.type==='keyvalue'&&s.id!=='sec-info'&&s.enabled!==false)
    .map(s=>s.id);
  const allTabIds=[...tabOrder,...customTabs,...customKVTabs].filter((id,i,arr)=>arr.indexOf(id)===i);
  const getDynLabel=id=>{
    if(id==='logs')return `📝 日誌(${p.logs.length})`;
    if(id==='notes')return `🗒️ 備註(${(p.notes||[]).length})`;
    if(id==='todos')return `📌 待辦(${(p.todos||[]).filter(t=>!t.done).length})`;
    if(TAB_DEF[id])return TAB_DEF[id];
    const sec=secs.find(s=>s.id===id);
    return sec?`📋 ${escH(sec.label)}`:id;
  };
  let h=`<button class="d-back" id="btn-back">← 返回列表</button>
  <div class="d-card">
    <div class="d-hero">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div>
          <div class="d-name">${p.mascot||'🐾'} ${escH(p.name)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            <span class="badge" style="background:${st.color}22;color:${st.color}">${escH(st.name)}</span>
            ${p.status==='closed'?'<span class="badge" style="background:var(--gray);color:white">✅ 結案</span>':''}
            ${p.status==='lost'?'<span class="badge" style="background:var(--gray-l);color:var(--gray);border:1px solid var(--gray)">❌ 流標</span>':''}
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-sm" id="btn-edit-proj">✏️ 編輯</button>
          <button class="btn btn-p btn-sm" id="btn-add-log">＋ 新增紀錄</button>
          <button class="btn btn-sm" id="btn-status">🔄 狀態</button>
          <button class="btn btn-sm btn-danger" id="btn-del-proj">🗑️ 刪除</button>
        </div>
      </div>
      <div class="stage-labels">${ps.map(s=>`<div class="stage-lbl ${s.id===p.stage?'cur':''}" style="${s.id===p.stage?'color:'+s.color:''}">${escH(s.name)}</div>`).join('')}</div>
      <div class="stage-steps">${ps.map((s,i)=>`<div class="stage-step" style="background:${i<idx?s.color+'99':i===idx?s.color:'var(--bg2)'}"></div>`).join('')}</div>
      <div style="text-align:right;font-size:11px;font-weight:800;color:${st.color};margin-top:2px">${pct}% 完成</div>
    </div>
    <div class="d-tabs-wrap"><div class="d-tabs" id="d-tabs-row">
      ${allTabIds.map(id=>`<button class="d-tab ${curDTab===id?'active':''}" data-tab="${id}" draggable="true">${getDynLabel(id)}</button>`).join('')}
    </div></div>
    <div id="d-pane">${renderPane(p,secs)}</div>
  </div>`;
  document.getElementById('detail-view').innerHTML=h;
  document.getElementById('btn-back').addEventListener('click',()=>{showList();renderTopStats();renderAlerts();renderProjects();});
  document.getElementById('btn-edit-proj').addEventListener('click',()=>openProjModal(curPid));
  document.getElementById('btn-add-log').addEventListener('click',()=>openLogModal(curPid,null));
  document.getElementById('btn-status').addEventListener('click',()=>openStatusModal(curPid));
  document.getElementById('btn-del-proj').addEventListener('click',()=>{
    const p2=G.projects.find(x=>x.id===curPid);if(!p2)return;
    if(!confirm(`確定要刪除「${p2.name}」？`))return;
    G.projects=G.projects.filter(x=>x.id!==curPid);
    save();showList();renderYearFilter();renderTopStats();renderAlerts();renderProjects();
  });
  document.querySelectorAll('.d-tab').forEach(btn=>btn.addEventListener('click',()=>{curDTab=btn.dataset.tab;renderDetail();}));
  initTabDrag();bindPaneEvents(p,secs);
}

let _tabDragFrom=null;
function initTabDrag(){
  document.querySelectorAll('.d-tab').forEach(btn=>{
    btn.addEventListener('dragstart',e=>{_tabDragFrom=btn.dataset.tab;btn.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    btn.addEventListener('dragend',()=>{btn.classList.remove('dragging');document.querySelectorAll('.d-tab').forEach(b=>b.classList.remove('drag-over'));});
    btn.addEventListener('dragover',e=>{e.preventDefault();if(btn.dataset.tab!==_tabDragFrom)btn.classList.add('drag-over');});
    btn.addEventListener('dragleave',()=>btn.classList.remove('drag-over'));
    btn.addEventListener('drop',e=>{
      e.preventDefault();btn.classList.remove('drag-over');
      if(!_tabDragFrom||_tabDragFrom===btn.dataset.tab)return;
      const order=[...G.tabOrder];
      const fi=order.indexOf(_tabDragFrom),ti=order.indexOf(btn.dataset.tab);
      if(fi>=0&&ti>=0){order.splice(fi,1);order.splice(ti,0,_tabDragFrom);G.tabOrder=order;save();}
      renderDetail();_tabDragFrom=null;
    });
  });
}

function renderPane(p,secs){
  if(curDTab==='info')return paneInfo(p,secs);
  if(curDTab==='contacts')return paneContacts(p,secs);
  if(curDTab==='stages')return paneStages(p);
  if(curDTab==='checklist')return paneChecklist(p);
  if(curDTab==='todos')return paneTodos(p,secs);
  if(curDTab==='logs')return paneLogs(p,secs);
  if(curDTab==='notes')return paneNotes(p);
  // Custom section tab
  const sec=secs.find(s=>s.id===curDTab);
  if(sec)return paneCustomSection(p,sec);
  return '';
}

// ── PANE: INFO ────────────────────────────────────
function paneInfo(p,secs){
  const sd=p.sectionData||{};
  const infoSec=secs.find(s=>s.id==='sec-info');
  const attrSec=secs.find(s=>s.id==='sec-attrs');
  const certSec=secs.find(s=>s.id==='sec-certs');
  const selAttrs=Array.isArray(sd['sec-attrs'])?sd['sec-attrs']:[];
  const selCerts=Array.isArray(sd['sec-certs'])?sd['sec-certs']:[];
  const infoVals=(typeof sd['sec-info']==='object'&&!Array.isArray(sd['sec-info']))?sd['sec-info']:{};
  const r=(l,v,fn)=>v?`<div><div class="info-label">${escH(l)}</div><div class="info-value" onclick="${fn}">${escH(v)}</div></div>`:'';
  let h=`<div class="d-pane active"><div class="info-grid">
    ${r('📅 接洽日期',p.contactDate||'',`inlineEdit(${p.id},'contactDate','${escH(p.contactDate||'')}','接洽日期')`)}
    ${r('💰 報價金額',p.price?'NT$ '+p.price:'',`inlineEdit(${p.id},'price','${escH(p.price||'')}','報價金額')`)}
    ${r('👥 案件來源',p.source||'',`inlineEdit(${p.id},'source','${escH(p.source||'')}','案件來源')`)}
    ${p.followup?`<div><div class="info-label">🔔 下次追蹤</div><div style="display:flex;align-items:center;gap:6px"><div class="info-value" onclick="inlineEdit(${p.id},'followup','${p.followup||''}','下次追蹤')">${p.followup}${p.followupTime?' '+p.followupTime:''}</div><button class="ibtn" style="color:var(--red);font-size:11px" onclick="clearFollowup(${p.id})">✕ 清除</button></div></div>`:''}
    ${p.status==='closed'&&p.closedDate?r('✅ 結案日期',p.closedDate,''):''}
    ${p.status==='lost'&&p.lostDate?r('❌ 流標日期',p.lostDate,''):''}
    ${infoSec&&infoSec.enabled!==false?(infoSec.items||[]).filter(f=>infoVals[f.id]).map(f=>r(f.label,infoVals[f.id]||'',`inlineEditSD(${p.id},'sec-info','${f.id}','${escH(infoVals[f.id]||'')}','${escH(f.label)}')`)).join(''):''}
    ${Object.entries(p.customBasicFields||{}).filter(([k,v])=>v).map(([k,v])=>`<div><div class="info-label">${escH(k)}</div><div class="info-value" onclick="inlineEditCBF(${p.id},'${escH(k)}','${escH(v)}')">${escH(v)}</div></div>`).join('')}
  </div>
  ${(p.certPrices||[]).length?`<div style="margin-top:11px"><div class="info-label" style="margin-bottom:6px">💰 分項報價</div><div style="display:flex;flex-direction:column;gap:4px">${(p.certPrices||[]).map(cp=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--sage4);border-radius:var(--rxs);border:1px solid var(--border)"><span style="font-size:12px;font-weight:700;color:var(--text2)">${escH(cp.certName||'')}</span><span style="font-size:12px;font-weight:700;color:var(--sage)">NT$ ${Number(String(cp.amount||'0').replace(/,/g,'')).toLocaleString()}</span></div>`).join('')}<div style="display:flex;justify-content:space-between;padding:5px 9px;border-top:1px dashed var(--border);margin-top:2px"><span style="font-size:12px;font-weight:800;color:var(--text2)">合計</span><span style="font-size:13px;font-weight:800;color:var(--sage)">NT$ ${(p.certPrices||[]).reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0).toLocaleString()}</span></div></div></div>`:''}`;
  if(attrSec&&attrSec.enabled!==false&&selAttrs.length)h+=`<div style="margin-top:11px"><div class="info-label" style="margin-bottom:5px">${escH(attrSec.label)}</div><div style="display:flex;flex-wrap:wrap;gap:5px">${selAttrs.map(a=>`<span class="badge badge-attr">${escH(a)}</span>`).join('')}</div></div>`;
  if(certSec&&certSec.enabled!==false&&selCerts.length)h+=`<div style="margin-top:11px"><div class="info-label" style="margin-bottom:5px">${escH(certSec.label)}</div><div style="display:flex;flex-wrap:wrap;gap:5px">${selCerts.map(c=>`<span class="badge badge-cert">${escH(c)}</span>`).join('')}</div></div>`;
  return h+'</div>';
}

function clearFollowupFromCard(pid){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  p.followup='';p.followupTime='';p.remindBeforeN='';p.remindBeforeUnit='min';
  save();renderTopStats();renderAlerts();renderProjects();
}

function clearFollowup(pid){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  if(!confirm('確定清除追蹤日期？'))return;
  p.followup='';p.followupTime='';p.remindBeforeN='';p.remindBeforeUnit='min';
  save();renderDetail();renderTopStats();renderAlerts();renderProjects();
}

function clearLogFollowup(pid,logIdx){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  if(!confirm('確定清除此日誌的追蹤日期？'))return;
  p.logs[logIdx].followup='';p.logs[logIdx].followupTime='';
  // If this was the project's main followup, also clear that
  save();renderDetail();
}

function inlineEdit(pid,field,oldVal,label){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  openModal(`編輯：${label}`,`<div class="form-row"><label class="form-label">${escH(label)}</label><input type="text" id="ie-val" value="${escH(oldVal)}"></div>`,
  ()=>{p[field]=document.getElementById('ie-val').value.trim();save();closeModal();renderDetail();});
}
function inlineEditSD(pid,secId,fid,oldVal,label){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  openModal(`編輯：${label}`,`<div class="form-row"><label class="form-label">${escH(label)}</label><input type="text" id="ie-val" value="${escH(oldVal)}"></div>`,
  ()=>{if(!p.sectionData)p.sectionData={};if(typeof p.sectionData[secId]!=='object'||Array.isArray(p.sectionData[secId]))p.sectionData[secId]={};p.sectionData[secId][fid]=document.getElementById('ie-val').value.trim();save();closeModal();renderDetail();});
}
function inlineEditCBF(pid,key,oldVal){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  openModal(`編輯：${key}`,`<div class="form-row"><label class="form-label">${escH(key)}</label><input type="text" id="ie-val" value="${escH(oldVal)}"></div>`,
  ()=>{if(!p.customBasicFields)p.customBasicFields={};p.customBasicFields[key]=document.getElementById('ie-val').value.trim();save();closeModal();renderDetail();});
}

// ── PANE: CONTACTS ────────────────────────────────
function paneContacts(p,secs){
  const sec=secs.find(s=>s.id==='sec-contacts');
  if(!sec||sec.enabled===false)return`<div class="d-pane active"><div class="empty-state"><div class="empty-icon">👤</div><p>聯絡人區塊已停用</p></div></div>`;
  const sd=p.sectionData||{};
  const cData=(typeof sd['sec-contacts']==='object'&&!Array.isArray(sd['sec-contacts']))?sd['sec-contacts']:{};
  let h=`<div class="d-pane active">`;
  // Custom contact fields management button
  h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-sm" onclick="openManageContactFields(${p.id})">✏️ 管理聯絡人欄位</button></div>`;
  (sec.roles||[]).forEach(role=>{
    const d=cData[role.id]||{};
    const hasData=role.fields.some(f=>d[f.id]);
    h+=`<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div class="form-label">${escH(role.label)}</div>
        <button class="ibtn" data-action="edit-contact" data-role="${role.id}">✏️ 編輯</button>
      </div>`;
    if(!hasData)h+=`<div style="font-size:13px;color:var(--text3);padding:11px;background:var(--sage4);border-radius:var(--rsm);border:1.5px dashed var(--border)">尚未填寫${escH(role.label)}資訊</div>`;
    else h+=`<div class="contact-card"><div class="contact-name">${escH(d[role.fields[0]?.id]||'')} <span style="font-size:12px;font-weight:400;color:var(--text3)">${escH(d[role.fields[1]?.id]||'')}</span></div>${role.fields.slice(2).map(f=>d[f.id]?`<div class="contact-row">📌 ${escH(f.label)}：${escH(d[f.id])}</div>`:'').join('')}</div>`;
    h+=`</div>`;
  });
  return h+'</div>';
}

function openManageContactFields(pid){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  const secs=getEffSecs(p);
  const sec=secs.find(s=>s.id==='sec-contacts');if(!sec)return;
  let rolesH=(sec.roles||[]).map((r,ri)=>`
    <div style="margin-bottom:12px;padding:10px;background:var(--sage4);border-radius:var(--rsm);border:1.5px solid var(--border)">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
        <input type="text" value="${escH(r.label)}" id="cr-lbl-${ri}" style="flex:1;font-weight:700">
        <button class="btn btn-sm btn-danger" onclick="rmContactRole(${ri})">✕ 移除</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:5px">欄位（點擊刪除）：</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px" id="cf-list-${ri}">${r.fields.map((f,fi)=>`<span class="tag-pill" onclick="rmContactField(${ri},${fi})">${escH(f.label)} ✕</span>`).join('')}</div>
      <div class="add-row" style="margin-top:6px"><input type="text" id="cf-new-${ri}" placeholder="新增欄位名稱"><button class="btn btn-sm" onclick="addContactField(${ri})">＋</button></div>
    </div>`).join('');
  openModal('管理聯絡人欄位',`
    <div id="cr-list">${rolesH}</div>
    <div class="add-row"><input type="text" id="cr-new-label" placeholder="新增聯絡人角色，例：業主代理人"><button class="btn btn-sm btn-p" onclick="addContactRole()">＋ 新增角色</button></div>`,
  ()=>{
    // Save role labels
    (sec.roles||[]).forEach((r,ri)=>{const el=document.getElementById('cr-lbl-'+ri);if(el)r.label=el.value.trim()||r.label;});
    // Apply to project's projSections
    if(!p.projSections)p.projSections=JSON.parse(JSON.stringify(secs));
    else{const s2=p.projSections.find(s=>s.id==='sec-contacts');if(s2)s2.roles=sec.roles;}
    save();closeModal();renderDetail();
  });
  window._editContactSec=sec;window._editContactPid=pid;
}

window._editContactSec=null;window._editContactPid=null;
function addContactRole(){
  const label=document.getElementById('cr-new-label')?.value?.trim();if(!label)return;
  if(!window._editContactSec.roles)window._editContactSec.roles=[];
  const ri=window._editContactSec.roles.length;
  window._editContactSec.roles.push({id:'cr'+Date.now(),label,fields:[{id:'cf1',label:'姓名'},{id:'cf2',label:'電話'},{id:'cf3',label:'信箱'}]});
  closeModal();openManageContactFields(window._editContactPid);
}
function rmContactRole(ri){
  if(!confirm('確定移除此聯絡人角色？'))return;
  window._editContactSec.roles.splice(ri,1);
  closeModal();openManageContactFields(window._editContactPid);
}
function addContactField(ri){
  const v=document.getElementById('cf-new-'+ri)?.value?.trim();if(!v)return;
  const fid='cf'+Date.now();
  window._editContactSec.roles[ri].fields.push({id:fid,label:v});
  closeModal();openManageContactFields(window._editContactPid);
}
function rmContactField(ri,fi){
  window._editContactSec.roles[ri].fields.splice(fi,1);
  closeModal();openManageContactFields(window._editContactPid);
}

// ── PANE: STAGES ──────────────────────────────────
function paneStages(p){
  // Per-project stages - completely independent from global
  const projIds=getProjStageIds(p);
  const ps=projIds.map(id=>stageById(id)).filter(Boolean);
  const unusedGlobal=G.stages.filter(s=>!projIds.includes(s.id));
  let h=`<div class="d-pane active">
    <div style="font-size:13px;color:var(--text2);margin-bottom:11px">此專案的工作階段獨立設定，拖曳調整順序，不影響其他專案或全局設定。</div>
    <div id="proj-stage-list">`;
  ps.forEach((s,i)=>{
    h+=`<div class="proj-stage-item" draggable="true" data-si="${i}" data-sid="${s.id}">
      <span class="drag-handle">⠿</span><span class="color-dot" style="background:${s.color}"></span>
      <input class="editable-inline" value="${escH(s.name)}" data-action="rename-proj-stage" data-sid="${s.id}" style="flex:1;font-weight:700">
      <span style="font-size:11px;color:var(--text3);padding:2px 8px;background:var(--bg2);border-radius:20px">${i+1}</span>
      <button class="ibtn" data-action="rm-proj-stage" data-sid="${s.id}">✕</button>
    </div>`;
  });
  h+=`</div>
    <div style="margin-top:11px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px">從全局階段加入：</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${unusedGlobal.map(s=>`<button class="topt" data-action="add-proj-stage" data-sid="${s.id}">${escH(s.name)}</button>`).join('')}</div>
      <div style="margin-top:8px;display:flex;gap:7px">
        <button class="btn btn-sm" data-action="add-custom-proj-stage">＋ 新增自訂階段</button>
        <button class="btn btn-sm btn-ghost" data-action="reset-proj-stages">↺ 重設為公版</button>
      </div>
    </div>
  </div>`;
  return h;
}

// ── PANE: CHECKLIST ───────────────────────────────
function paneChecklist(p){
  let h=`<div class="d-pane active">`;
  (p.checklist||[]).forEach((sec,si)=>{
    h+=`<div class="cl-section"><div class="cl-stitle">
      <input class="editable-inline" value="${escH(sec.section)}" data-action="rename-cl-sec" data-si="${si}" style="font-size:12px;font-weight:800;color:var(--text2)">
      <button class="btn btn-sm btn-ghost" data-action="add-cl" data-si="${si}">＋ 新增</button>
    </div>`;
    (sec.items||[]).forEach((item,ii)=>{
      h+=`<div class="cl-item ${item.done?'done':''}">
        <div class="cl-check ${item.done?'checked':''}" data-action="toggle-cl" data-si="${si}" data-ii="${ii}">${item.done?'✓':''}</div>
        <div class="cl-body">
          <div class="cl-label">${escH(item.label)}</div>
          ${item.note?`<div class="cl-note">📎 ${escH(item.note)}</div>`:''}
          ${item.done&&item.doneDate?`<div class="cl-date">✅ 完成：${item.doneDate}</div>`:''}
        </div>
        <button class="ibtn" data-action="edit-cl" data-si="${si}" data-ii="${ii}">✏️</button>
        <button class="ibtn" data-action="rm-cl" data-si="${si}" data-ii="${ii}">✕</button>
      </div>`;
    });
    h+=`</div>`;
  });
  return h+`<button class="btn btn-sm" data-action="add-cl-sec">＋ 新增區塊</button></div>`;
}

// ── PANE: TODOS ───────────────────────────────────
function paneTodos(p,secs){
  const sec=secs.find(s=>s.id==='sec-todos');
  let h=`<div class="d-pane active"><div style="display:flex;justify-content:flex-end;margin-bottom:11px"><button class="btn btn-p btn-sm" data-action="add-todo">＋ 新增待辦</button></div>`;

// ── BIND PANE EVENTS ──────────────────────────────
let _psDragFrom=null;
function bindPaneEvents(p,secs){
  const pane=document.getElementById('d-pane');
  // Stage drag
  pane.querySelectorAll('.proj-stage-item[draggable]').forEach(el=>{
    el.addEventListener('dragstart',()=>{_psDragFrom=parseInt(el.dataset.si);el.style.opacity='.4';});
    el.addEventListener('dragend',()=>{el.style.opacity='1';document.querySelectorAll('.proj-stage-item').forEach(x=>x.classList.remove('drag-over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',()=>{
      el.classList.remove('drag-over');if(_psDragFrom===null)return;
      const ids=getProjStageIds(p);
      const item=ids.splice(_psDragFrom,1)[0];ids.splice(parseInt(el.dataset.si),0,item);
      p.projStageIds=ids;_psDragFrom=null;save();renderDetail();
    });
  });
  pane.querySelectorAll('[data-action=rename-proj-stage]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      // Rename only within this project's custom stage name (stored locally)
      if(!p.projStageIds)p.projStageIds=getProjStageIds(p);
      if(!p.projStageNames)p.projStageNames={};
      p.projStageNames[inp.dataset.sid]=inp.value.trim();
      save();
    });
  });
  pane.querySelectorAll('[data-action=rename-cl-sec]').forEach(inp=>{
    inp.addEventListener('change',()=>{const si=parseInt(inp.dataset.si);if(p.checklist[si])p.checklist[si].section=inp.value.trim()||p.checklist[si].section;save();});
  });
  pane.querySelectorAll('[data-action]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const a=el.dataset.action,si=parseInt(el.dataset.si),ii=parseInt(el.dataset.ii),i=parseInt(el.dataset.i);
      // CHECKLIST
      if(a==='toggle-cl'){
        const item=p.checklist[si].items[ii];
        if(!item.done){
          // Ask for completion date
          openModal('確認完成日期',`
            <div class="form-row"><label class="form-label">完成日期</label><input type="date" id="cl-done-date" value="${TODAY}"></div>
            <div class="hint">可修改為實際完成日期</div>`,
          ()=>{item.done=true;item.doneDate=document.getElementById('cl-done-date').value||TODAY;save();closeModal();renderDetail();});
        } else {item.done=false;item.doneDate='';save();renderDetail();}
      }
      if(a==='add-cl')openAddClItem(p.id,si);
      if(a==='edit-cl')openEditClItem(p.id,si,ii);
      if(a==='rm-cl'){if(!confirm('刪除？'))return;p.checklist[si].items.splice(ii,1);save();renderDetail();}
      if(a==='add-cl-sec')openAddClSec(p.id);
      // TODOS
      if(a==='toggle-todo'){
        const t=p.todos[i];
        if(!t.done){
          openModal('確認完成日期',`
            <div class="form-row"><label class="form-label">完成日期</label><input type="date" id="td-done-date" value="${TODAY}"></div>`,
          ()=>{t.done=true;t.doneDate=document.getElementById('td-done-date').value||TODAY;save();closeModal();renderDetail();});
        } else {t.done=false;t.doneDate='';save();renderDetail();}
      }
      if(a==='add-todo')openTodoModal(p.id,null,secs);
      if(a==='edit-todo')openTodoModal(p.id,i,secs);
      if(a==='rm-todo'){p.todos.splice(i,1);save();renderDetail();}
      if(a==='clear-todo-followup'){p.todos[i].followup='';p.todos[i].followupTime='';p.todos[i].remindBeforeN='';save();renderDetail();}
      // LOGS
      if(a==='add-log')openLogModal(p.id,null,secs);
      if(a==='edit-log')openLogModal(p.id,i,secs);
      if(a==='rm-log'){if(!confirm('刪除？'))return;p.logs.splice(i,1);save();renderDetail();}
      // NOTES
      if(a==='add-note')openNoteModal(p.id,null);
      if(a==='edit-note')openNoteModal(p.id,i);
      if(a==='rm-note'){if(!confirm('刪除？'))return;p.notes.splice(i,1);save();renderDetail();}
      // MEDIA
      if(a==='lightbox'){document.getElementById('lb-img').src=el.dataset.src;document.getElementById('lightbox').classList.add('open');}
      if(a==='dl-file'){const a2=document.createElement('a');a2.href=el.dataset.src;a2.download=el.dataset.name;a2.click();}
      // CONTACTS
      if(a==='edit-contact')openContactEditModal(p.id,el.dataset.role,secs);
      // STAGES
      if(a==='rm-proj-stage'){
        if(!p.projStageIds)p.projStageIds=getProjStageIds(p);
        p.projStageIds=p.projStageIds.filter(id=>id!==el.dataset.sid);save();renderDetail();
      }
      if(a==='add-proj-stage'){
        if(!p.projStageIds)p.projStageIds=getProjStageIds(p);
        p.projStageIds=[...p.projStageIds,el.dataset.sid];save();renderDetail();
      }
      if(a==='add-custom-proj-stage'){
        const name=prompt('請輸入新階段名稱');if(!name?.trim())return;
        const ns={id:'s'+Date.now(),name:name.trim(),color:COLORS[G.stages.length%COLORS.length]};
        G.stages.push(ns);
        if(!p.projStageIds)p.projStageIds=getProjStageIds(p);
        p.projStageIds=[...p.projStageIds,ns.id];
        save();renderDetail();
      }
      if(a==='reset-proj-stages'){p.projStageIds=null;save();renderDetail();}
    });
  });
}

function remindBeforeHTML(rn,ru){
  const remindOpts=[
    {v:'',l:'不提前提醒'},
    {v:'5|min',l:'5 分鐘前'},{v:'10|min',l:'10 分鐘前'},{v:'15|min',l:'15 分鐘前'},
    {v:'30|min',l:'30 分鐘前'},{v:'60|min',l:'1 小時前'},{v:'120|min',l:'2 小時前'},
    {v:'1|hr',l:'1 小時前'},{v:'2|hr',l:'2 小時前'},{v:'24|hr',l:'1 天前'}
  ];
  const curVal=rn?(rn+'|'+(ru||'min')):'';
  return `<div class="form-row"><label class="form-label">提前提醒</label>
    <select id="m-remind-sel">
      ${remindOpts.map(o=>`<option value="${o.v}" ${curVal===o.v||(!curVal&&!o.v)?'selected':''}>${o.l}</option>`).join('')}
    </select>
  </div>`;
}
function getRemindVals(){
  const sel=document.getElementById('m-remind-sel');
  if(!sel||!sel.value)return{n:'',u:'min'};
  const [n,u]=sel.value.split('|');
  return{n:n||'',u:u||'min'};
}
function getRemindVals(){return{n:document.getElementById('m-remind-n')?.value||'',u:document.getElementById('m-remind-unit')?.value||'min'};}

function openTodoModal(pid,editIdx,secs){

  const effSecs=secs||getEffSecs(p);
  const todoSec=effSecs.find(s=>s.id==='sec-todos');

  const isEdit=editIdx!==null&&editIdx!==undefined;
  const t=isEdit?p.todos[editIdx]:{label:'',followup:'',followupTime:'',remindBeforeN:'',remindBeforeUnit:'min',done:false,doneDate:''};
  openModal(isEdit?'編輯待辦':'新增待辦',`
    ${opts.length?`<div class="form-row"><label class="form-label">快速選擇</label><div class="tag-sel" id="m-todo-opts">${opts.map(o=>`<button class="topt">${escH(o)}</button>`).join('')}</div></div>`:''}
    <div class="form-row"><label class="form-label">待辦內容</label><input type="text" id="m-todo-label" value="${escH(t.label||'')}" placeholder="自訂待辦"></div>

    const newT={id:isEdit?t.id:'t'+Date.now(),label:v,followup:document.getElementById('m-todo-date').value,followupTime:getTimeSelectVal('m-todo-time'),remindBeforeN:rv.n,remindBeforeUnit:rv.u,done:isEdit?t.done:false,doneDate:isEdit?t.doneDate:''};
    if(isEdit)p.todos[editIdx]=newT;else p.todos.push(newT);
    save();closeModal();renderDetail();scheduleAlarmCheck();
  });
  setTimeout(()=>{
    document.querySelectorAll('#m-todo-opts .topt').forEach(btn=>btn.addEventListener('click',()=>{
      document.getElementById('m-todo-label').value=btn.textContent;
    }));
  },50);
}
