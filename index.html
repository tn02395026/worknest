<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 宗宗的家</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F5;--bg2:#E8EFE9;--white:#FFFFFF;
  --sage:#6B9E7A;--sage2:#8DB89A;--sage3:#C5DCCA;--sage4:#EDF5EF;
  --text:#2C3A2E;--text2:#5A6E5C;--text3:#9AB09C;
  --border:#D0E0D3;--border2:#B8CEB8;
  --accent:#6B9E7A;
  --warm:#E8926A;--warm-l:#FDF0E8;
  --blue:#5B8DD9;--blue-l:#E8F1FB;
  --red:#E05C5C;--red-l:#FDEAEA;
  --purple:#9B7FD4;
  --yellow:#C9973A;--yellow-l:#FDF4E3;
  --gray:#8E9E90;--gray-l:#EFF3F0;
  --shadow:0 2px 10px rgba(107,158,122,0.10);
  --shadow2:0 4px 20px rgba(107,158,122,0.16);
  --r:14px;--rsm:9px;--rxs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--white);border-right:1.5px solid var(--border);display:flex;flex-direction:column;padding:1.2rem .9rem;z-index:100;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:1.4rem;padding:0 4px}
.logo-icon{font-size:26px;animation:float 3s ease-in-out infinite}
.logo-text{font-size:15px;font-weight:800;color:var(--text)}
.nav{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rsm);cursor:pointer;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:3px;transition:all .15s;user-select:none}
.nav:hover{background:var(--sage4);color:var(--sage)}
.nav.active{background:var(--sage);color:white;box-shadow:0 2px 8px rgba(107,158,122,.3)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:200px;padding:1.75rem 1.75rem 4rem;max-width:1100px}
.page{display:none}.page.active{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem;flex-wrap:wrap;gap:10px}
.pt{font-size:20px;font-weight:800}
.btn{padding:7px 15px;border-radius:var(--rsm);border:1.5px solid var(--border2);background:var(--white);cursor:pointer;font-size:13px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--sage4)}
.btn-p{background:var(--sage);color:white;border-color:var(--sage)}
.btn-p:hover{background:var(--sage2);border-color:var(--sage2)}
.btn-sm{padding:4px 11px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--sage4)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel],select,textarea{padding:8px 11px;border-radius:var(--rxs);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--sage4);color:var(--text);width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage);background:white}
textarea{resize:vertical;min-height:70px}
.form-section{margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px dashed var(--border)}
.form-section:last-child{border-bottom:none;margin-bottom:0}
.form-stitle{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.form-row{margin-bottom:9px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:3px}
.tag-sel{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.topt{padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s;font-family:inherit}
.topt:hover{border-color:var(--sage);color:var(--sage)}
.topt.sel{background:var(--sage);color:white;border-color:var(--sage)}
.add-row{display:flex;gap:6px;margin-top:5px}
.add-row input{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:3px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-cert{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.badge-attr{background:var(--blue-l);color:var(--blue);border:1px solid #c5d8ef;font-size:10px}
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem}
.chip{padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s;white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--sage);color:var(--sage)}
.chip.active{background:var(--text);color:white;border-color:var(--text)}
.chip-red{border-color:var(--red);color:var(--red)}
.chip-red.active{background:var(--red);color:white}
.search-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3)}
.search-inp{width:100%;padding:8px 11px 8px 32px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--white)}
.search-inp:focus{outline:none;border-color:var(--sage)}
.filter-sel{padding:8px 11px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:13px;font-family:inherit;background:var(--white);cursor:pointer}
.dg-header{font-size:12px;font-weight:800;color:var(--text3);letter-spacing:.07em;margin:1.2rem 0 .7rem;display:flex;align-items:center;gap:8px}
.dg-header::after{content:'';flex:1;height:1px;background:var(--border)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px}
.pcard{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:.95rem 1rem;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow2)}
.pcard.overdue{border-left:4px solid var(--red)}
.pcard.closed{opacity:.70;background:var(--gray-l)}
.pcard.lost{border-left:4px solid var(--gray);background:var(--gray-l)}
.card-mascot{position:absolute;top:9px;right:9px;font-size:19px;cursor:pointer;transition:transform .3s;user-select:none}
.pcard:hover .card-mascot{transform:rotate(15deg) scale(1.2)}
.card-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:5px;padding-right:26px;line-height:1.4}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.prog-track{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-label{font-size:10px;color:var(--text3);display:flex;justify-content:space-between}
.card-meta{font-size:11px;color:var(--text3);display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.card-todo{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.ctodo-item{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.ctodo-dot{width:5px;height:5px;border-radius:50%;background:var(--sage3);flex-shrink:0}
.card-attrs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sbanner{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--rxs);display:inline-flex;align-items:center;gap:4px;margin-top:3px}
.sbanner-closed{background:var(--gray);color:white}
.sbanner-lost{background:var(--gray-l);color:var(--gray);border:1px solid var(--gray)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px;margin-bottom:1.4rem}
.stat-card{background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:13px;text-align:center}
.stat-num{font-size:23px;font-weight:800}
.stat-label{font-size:11px;color:var(--text3);font-weight:700;margin-top:2px}
.alert-banner{border-radius:var(--rsm);padding:11px 15px;margin-bottom:1rem;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.alert-red{background:var(--red-l);color:var(--red);border:1.5px solid #f5b8b8}
.modal-ov{position:fixed;inset:0;background:rgba(44,58,46,.35);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.modal-ov.open{display:flex}
.modal{background:var(--white);border-radius:var(--r);width:100%;max-width:620px;box-shadow:var(--shadow2)}
.modal-hdr{padding:1.1rem 1.4rem .9rem;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:800}
.modal-close{background:none;border:none;font-size:19px;cursor:pointer;color:var(--text3);padding:2px 5px;border-radius:5px}
.modal-close:hover{background:var(--sage4)}
.modal-body{padding:1.1rem 1.4rem;max-height:70vh;overflow-y:auto}
.modal-footer{padding:.9rem 1.4rem;border-top:1.5px solid var(--border);display:flex;gap:7px;justify-content:flex-end}
.d-back{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;font-weight:700;padding:0;margin-bottom:.9rem;font-family:inherit}
.d-back:hover{color:var(--sage)}
.d-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.d-hero{padding:1.3rem;border-bottom:1.5px solid var(--border)}
.d-name{font-size:19px;font-weight:800;margin-bottom:7px}
.d-tabs-wrap{border-bottom:1.5px solid var(--border);overflow-x:auto;user-select:none}
.d-tabs{display:flex;min-width:max-content}
.d-tab{padding:10px 14px;border:none;background:transparent;cursor:grab;font-size:13px;font-weight:700;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:inherit;white-space:nowrap;transition:all .15s}
.d-tab:hover{color:var(--sage)}
.d-tab.active{color:var(--sage);border-bottom-color:var(--sage)}
.d-tab.dragging{opacity:.4;cursor:grabbing}
.d-tab.drag-over{border-left:2px solid var(--sage)}
.d-pane{padding:1.1rem 1.4rem;display:none}
.d-pane.active{display:block}
.stage-steps{display:flex;gap:3px;margin:7px 0 2px}
.stage-step{flex:1;height:5px;border-radius:3px}
.stage-labels{display:flex;gap:3px;margin-bottom:7px}
.stage-lbl{flex:1;font-size:10px;text-align:center;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-lbl.cur{font-weight:800}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.info-label{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:2px}
.info-value{font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px}
.info-value:hover{background:var(--sage4)}
.contact-card{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:11px}
.contact-name{font-size:14px;font-weight:800;margin-bottom:5px}
.contact-row{font-size:12px;color:var(--text2);margin-bottom:3px}
.log-item{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:7px}
.log-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.log-date{font-size:11px;color:var(--text3);font-weight:700}
.log-content{font-size:13px;line-height:1.6}
.log-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.log-tag{background:var(--white);color:var(--text2);padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border)}
.cl-section{margin-bottom:1.1rem}
.cl-stitle{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.cl-item{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;background:var(--sage4);border-radius:var(--rxs);border:1.5px solid var(--border);margin-bottom:5px}
.cl-item.done{opacity:.6}
.cl-item.done .cl-label{text-decoration:line-through;color:var(--text3)}
.cl-check{width:17px;height:17px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:white;margin-top:1px;transition:all .15s}
.cl-check.checked{background:var(--sage);border-color:var(--sage);color:white}
.cl-body{flex:1}
.cl-label{font-size:13px;font-weight:600}
.cl-note{font-size:11px;color:var(--text3);margin-top:2px}
.cl-date{font-size:11px;color:var(--sage);font-weight:700;margin-top:2px}
.todo-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border-radius:var(--rxs);border:1.5px solid var(--border);margin-bottom:5px}
.todo-label{flex:1;font-size:13px;font-weight:600}
.todo-dt{font-size:11px;color:var(--text3)}
.todo-dt.od{color:var(--red);font-weight:700}
.note-item{background:var(--sage4);border-radius:var(--rsm);padding:11px 13px;border:1.5px solid var(--border);margin-bottom:7px}
.note-hdr{display:flex;justify-content:space-between;margin-bottom:5px}
.note-files{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.thumb{width:65px;height:65px;border-radius:7px;object-fit:cover;border:1.5px solid var(--border);cursor:pointer}
.file-chip{display:flex;align-items:center;gap:4px;padding:5px 9px;background:var(--white);border-radius:6px;border:1.5px solid var(--border);font-size:12px;cursor:pointer}
.set-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:1.1rem 1.4rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.set-title{font-size:14px;font-weight:800;margin-bottom:3px}
.set-hint{font-size:12px;color:var(--text3);margin-bottom:11px}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:var(--sage4);border:1.5px solid var(--border);font-size:12px;font-weight:700;margin:3px}
.pill-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:0}
.pill-rm:hover{color:var(--red)}
.drag-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border:1.5px solid var(--border);border-radius:var(--rxs);margin-bottom:5px;cursor:grab;user-select:none}
.drag-handle{color:var(--text3);font-size:15px}
.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tpl-card{background:var(--sage4);border-radius:var(--rsm);border:1.5px solid var(--border);padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.tpl-card:hover,.tpl-card.sel-tpl{border-color:var(--sage)}
.tpl-card.sel-tpl{background:#EDF5EF}
.tpl-name{font-size:13px;font-weight:800}
.tpl-hint{font-size:11px;color:var(--text3);margin-top:2px}
.diary-item{background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:11px 13px;margin-bottom:7px}
.diary-proj{font-size:12px;font-weight:800;color:var(--sage);margin-bottom:3px;cursor:pointer}
.diary-proj:hover{text-decoration:underline}
.analytics-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);padding:1.1rem 1.4rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.analytics-title{font-size:14px;font-weight:800;margin-bottom:.9rem}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.bar-label{font-size:12px;font-weight:700;color:var(--text2);min-width:90px;text-align:right}
.bar-track{flex:1;height:19px;background:var(--bg2);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;display:flex;align-items:center;padding-left:7px;transition:width .5s}
.bar-val{font-size:11px;font-weight:800;color:white}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:7px}
.ibtn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px 5px;border-radius:4px;font-family:inherit}
.ibtn:hover{background:var(--sage4);color:var(--text)}
.proj-stage-item{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--sage4);border:1.5px solid var(--border);border-radius:var(--rxs);margin-bottom:5px;cursor:grab;user-select:none}
.proj-stage-item.drag-over{border-top:2px solid var(--sage)}
.editable-inline{border:none;background:transparent;font-size:inherit;font-weight:inherit;font-family:inherit;color:inherit;padding:2px 4px;border-radius:4px;width:100%}
.editable-inline:focus{outline:1.5px solid var(--sage);background:white}
#alarm-container{position:fixed;bottom:22px;right:22px;z-index:9000;display:flex;flex-direction:column-reverse;gap:9px;max-width:290px}
.alarm-popup{background:var(--white);border-radius:var(--r);border:2px solid var(--sage);box-shadow:var(--shadow2);width:290px;animation:slideUp .3s ease;overflow:hidden}
.alarm-top{background:linear-gradient(135deg,var(--sage),var(--sage2));padding:11px 15px;text-align:center}
.alarm-mascot{font-size:34px;display:block;animation:bounce 1s ease infinite}
.alarm-body{padding:11px 15px}
.alarm-title{font-size:13px;font-weight:800;margin-bottom:5px}
.alarm-msg{font-size:12px;color:var(--text2);margin-bottom:9px;line-height:1.5}
.alarm-btns{display:flex;gap:5px}
.alarm-ok{flex:1;padding:7px;background:var(--sage);color:white;border:none;border-radius:var(--rxs);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.alarm-snooze{flex:1;padding:7px;background:var(--sage4);color:var(--sage);border:1.5px solid var(--sage);border-radius:var(--rxs);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.snooze-panel{display:none;margin-top:7px;flex-wrap:wrap;gap:4px}
.snooze-opt{padding:3px 9px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;font-size:11px;font-weight:700;color:var(--text2);font-family:inherit}
.snooze-opt:hover{border-color:var(--sage);color:var(--sage)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:11px}
#lb-close{position:absolute;top:15px;right:22px;color:white;font-size:30px;cursor:pointer;background:none;border:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* ── DARK MODE ── */
[data-dark="1"]{--bg:#1C1F23;--bg2:#242830;--white:#2C3139;--text:#E8ECF0;--text2:#B0BAC8;--text3:#6B7A8D;--border:#363D4A;--border2:#454E5E;--sage:#2EB87A;--sage2:#26A06A;--sage3:#1A7A52;--sage4:#1A2D24;--red:#E05050;--red-l:#2D1A1A;--blue:#5B8DD9;--blue-l:#1A2040;--gray:#6B7A8D;--gray-l:#242830;--shadow:0 2px 10px rgba(0,0,0,.4);--shadow2:0 4px 20px rgba(0,0,0,.5)}
[data-dark="1"] body{background:var(--bg)}
[data-dark="1"] .pcard{background:#242830;border-color:#363D4A}
[data-dark="1"] .pcard.overdue{background:#251D1D;border-left-color:#E05050}
[data-dark="1"] .pcard.closed,[data-dark="1"] .pcard.lost{background:#1C1F23;opacity:.65}
[data-dark="1"] .sidebar{background:#242830;border-right-color:#363D4A}
[data-dark="1"] .modal{background:#2C3139}
[data-dark="1"] .modal-hdr,[data-dark="1"] .modal-footer{border-color:#363D4A}
[data-dark="1"] .d-card{background:#242830;border-color:#363D4A}
[data-dark="1"] .d-hero,[data-dark="1"] .d-tabs-wrap{border-color:#363D4A}
[data-dark="1"] .d-tab{color:#6B7A8D}
[data-dark="1"] .d-tab.active{color:var(--sage)}

function getProjectStages(p){
  const ids=(p.customStageIds&&p.customStageIds.length)?p.customStageIds:(getTpl(p.templateId)?.stageIds||G.stages.filter(s=>s.name!=='完成').map(s=>s.id));
  return ids.map(id=>stageById(id)).filter(Boolean);
}

// RENDER PROJECTS
function renderProjects(){
  const search=(document.getElementById('proj-search').value||'').toLowerCase();
  const fy=document.getElementById('filter-year').value,fm=document.getElementById('filter-month').value;
  let list=G.projects.filter(p=>{
    if(search&&!p.name.toLowerCase().includes(search))return false;
    if(fy&&String(p.year||new Date().getFullYear())!==fy)return false;
    if(fm&&String(p.month||1)!==fm)return false;
    if(activeFilter==='全部')return true;
    if(activeFilter==='overdue')return isOD(p.followup)&&p.status==='active';
    if(activeFilter==='closed')return p.status==='closed';
    if(activeFilter==='lost')return p.status==='lost';
    return p.stage===activeFilter;
  });
  if(!list.length){document.getElementById('projects-container').innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><p>沒有符合的專案</p></div>';return;}
  const groups={};
  list.forEach(p=>{const k=`${p.year||new Date().getFullYear()}-${String(p.month||1).padStart(2,'0')}`;(groups[k]=groups[k]||[]).push(p);});
  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(k=>{
    const[y,m]=k.split('-');
    html+=`<div class="dg-header">📅 ${y}年 ${MONTHS[parseInt(m)]}</div><div class="proj-grid">`;
    groups[k].forEach(p=>html+=cardHTML(p));
    html+=`</div>`;
  });
  document.getElementById('projects-container').innerHTML=html;
  document.querySelectorAll('.pcard').forEach(el=>el.addEventListener('click',()=>openProject(parseInt(el.dataset.id))));
  document.querySelectorAll('.card-mascot').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();cycleMascot(parseInt(el.dataset.id));}));
}

function cardHTML(p){
  const st=stageById(p.stage),ov=isOD(p.followup)&&p.status==='active';
  const ps=getProjectStages(p),idx=ps.findIndex(s=>s.id===p.stage);
  const pct=ps.length?Math.round(((idx+1)/ps.length)*100):0;
  const todos=(p.todos||[]).filter(t=>!t.done).slice(0,2);
  const visAttrs=(p.attrs||[]).slice(0,3);
  let sb='';
  if(p.status==='closed')sb=`<div class="sbanner sbanner-closed">✅ 結案${p.closedDate?' · '+p.closedDate:''}</div>`;
  if(p.status==='lost')sb=`<div class="sbanner sbanner-lost">❌ 流標${p.lostDate?' · '+p.lostDate:''}</div>`;
  return `<div class="pcard ${ov?'overdue':''} ${p.status==='closed'?'closed':''} ${p.status==='lost'?'lost':''}" data-id="${p.id}">
    <div class="card-mascot" data-id="${p.id}">${p.mascot||'🐾'}</div>
    <div class="card-name">${p.name}</div>
    <div class="card-badges">
      <span class="badge" style="background:${st.color}22;color:${st.color}">${st.name}</span>
      ${p.certs.slice(0,2).map(c=>`<span class="badge badge-cert">${c}</span>`).join('')}
    </div>
    ${visAttrs.length?`<div class="card-attrs">${visAttrs.map(a=>`<span class="badge badge-attr">${a}</span>`).join('')}</div>`:''}
    <div class="prog-track" style="margin-top:5px"><div class="prog-fill" style="width:${pct}%;background:${st.color}"></div></div>
    <div class="prog-label"><span>${st.name}</span><span style="font-weight:800;color:${st.color}">${pct}%</span></div>
    ${sb}
    ${ov?'<div class="overdue-badge">🐾 追蹤日期已到！</div>':''}
    <div class="card-meta">
      ${p.followup?`<span style="${ov?'color:var(--red);font-weight:700':''}">📅 ${p.followup}${p.followupTime?' '+p.followupTime:''}${ov?' ⚠':''}</span>`:''}
      ${(()=>{const t=(p.certPrices||[]).reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0);const d=t>0?t.toLocaleString():p.price;return d?`<span>💰 NT$ ${d}</span>`:''})()}
      ${p.source?`<span>👥 ${p.source}</span>`:''}
    </div>
    ${todos.length?`<div class="card-todo">${todos.map(t=>`<div class="ctodo-item"><span class="ctodo-dot"></span><span>${t.label}</span>${t.followup?`<span style="margin-left:auto;font-size:10px;color:${isOD(t.followup)&&!t.done?'var(--red)':'var(--text3)'}">${t.followup}</span>`:''}</div>`).join('')}</div>`:''}
  </div>`;
}

function cycleMascot(id){const p=G.projects.find(x=>x.id===id);if(!p)return;p.mascot=MASCOTS[(MASCOTS.indexOf(p.mascot)+1)%MASCOTS.length];save();renderProjects();}

// DETAIL

    <div class="d-hero">

          <div style="display:flex;flex-wrap:wrap;gap:5px">
            <span class="badge" style="background:${st.color}22;color:${st.color}">${st.name}</span>
            ${p.certs.map(c=>`<span class="badge badge-cert">${c}</span>`).join('')}
            ${p.status==='closed'?'<span class="badge" style="background:var(--gray);color:white">✅ 結案</span>':''}
            ${p.status==='lost'?'<span class="badge" style="background:var(--gray-l);color:var(--gray);border:1px solid var(--gray)">❌ 流標</span>':''}
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn btn-sm" id="btn-edit-proj">✏️ 編輯</button>
          <button class="btn btn-p btn-sm" id="btn-add-log">＋ 新增紀錄</button>
          <button class="btn btn-sm" id="btn-status">🔄 狀態</button>
        </div>
      </div>
      <div class="stage-labels">${ps.map(s=>`<div class="stage-lbl ${s.id===p.stage?'cur':''}" style="${s.id===p.stage?'color:'+s.color:''}">${s.name}</div>`).join('')}</div>
      <div class="stage-steps">${ps.map((s,i)=>`<div class="stage-step" style="background:${i<idx?s.color+'99':i===idx?s.color:'var(--bg2)'}"></div>`).join('')}</div>
      <div style="text-align:right;font-size:11px;font-weight:800;color:${st.color};margin-top:2px">${pct}% 完成</div>
    </div>
    <div class="d-tabs-wrap"><div class="d-tabs" id="d-tabs-row">
      ${tabOrder.map(id=>`<button class="d-tab ${curDTab===id?'active':''}" data-tab="${id}" draggable="true">${getDynLabel(id)}</button>`).join('')}
    </div></div>
    <div id="d-pane">${renderPane(p)}</div>
  </div>`;
  document.getElementById('detail-view').innerHTML=h;
  document.getElementById('btn-back').addEventListener('click',()=>{showList();renderStats();renderAlerts();renderProjects();});
  document.getElementById('btn-edit-proj').addEventListener('click',()=>openProjModal(curPid));
  document.getElementById('btn-add-log').addEventListener('click',()=>openLogModal(curPid,null));
  document.getElementById('btn-status').addEventListener('click',()=>openStatusModal(curPid));
  document.querySelectorAll('.d-tab').forEach(btn=>btn.addEventListener('click',()=>{curDTab=btn.dataset.tab;renderDetail();}));
  initTabDrag();bindPaneEvents(p);
}

// TAB DRAG
let _tabDragFrom=null;
function initTabDrag(){
  document.querySelectorAll('.d-tab').forEach(btn=>{
    btn.addEventListener('dragstart',e=>{_tabDragFrom=btn.dataset.tab;btn.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    btn.addEventListener('dragend',()=>{btn.classList.remove('dragging');document.querySelectorAll('.d-tab').forEach(b=>b.classList.remove('drag-over'));});
    btn.addEventListener('dragover',e=>{e.preventDefault();if(btn.dataset.tab!==_tabDragFrom)btn.classList.add('drag-over');});
    btn.addEventListener('dragleave',()=>btn.classList.remove('drag-over'));
    btn.addEventListener('drop',e=>{
      e.preventDefault();btn.classList.remove('drag-over');
      if(!_tabDragFrom||_tabDragFrom===btn.dataset.tab)return;
      const order=G.tabOrder||['info','contact','stages','checklist','todos','logs','notes'];
      const fi=order.indexOf(_tabDragFrom),ti=order.indexOf(btn.dataset.tab);
      if(fi<0||ti<0)return;
      order.splice(fi,1);order.splice(ti,0,_tabDragFrom);
      G.tabOrder=order;save();renderDetail();_tabDragFrom=null;
    });
  });
}

function renderPane(p){
  if(curDTab==='info')return paneInfo(p);if(curDTab==='contact')return paneContact(p);
  if(curDTab==='stages')return paneStages(p);if(curDTab==='checklist')return paneChecklist(p);
  if(curDTab==='todos')return paneTodos(p);if(curDTab==='logs')return paneLogs(p);
  if(curDTab==='notes')return paneNotes(p);return '';
}

      ${r('👥 案件來源',p.source,'source')}

    ${(p.certPrices||[]).length?'<div style="margin-top:11px"><div class="info-label" style="margin-bottom:6px">💰 分項報價</div>'+(p.certPrices||[]).map(cp=>'<div style="display:flex;justify-content:space-between;padding:5px 9px;background:var(--sage4);border-radius:var(--rxs);border:1px solid var(--border);margin-bottom:3px"><span style="font-size:12px;font-weight:700">'+escH(cp.certName||'')+'</span><span style="font-size:12px;color:var(--sage);font-weight:700">NT$ '+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0).toLocaleString()+'</span></div>').join('')+'<div style="display:flex;justify-content:space-between;padding:4px 9px;border-top:1px dashed var(--border)"><span style="font-size:12px;font-weight:800">合計</span><span style="font-size:13px;font-weight:800;color:var(--sage)">NT$ '+(p.certPrices||[]).reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0).toLocaleString()+'</span></div></div>':''}
    <div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn btn-sm" data-action="add-proj-field">＋ 新增資訊欄位</button>
    </div>
  </div>`;
}

function inlineEditField(pid,field,oldVal,label){
  const p=G.projects.find(x=>x.id===pid);if(!p)return;
  openModal(`編輯：${label}`,`<div class="form-row"><label class="form-label">${label}</label><input type="text" id="ie-val" value="${oldVal}"></div>`,
  ()=>{
    const v=document.getElementById('ie-val').value.trim();
    const directFields=['contactDate','price','source','followup','closedDate','lostDate'];
    if(directFields.includes(field))p[field]=v;
    else{if(!p.customFields)p.customFields={};p.customFields[field]=v;}
    save();closeModal();renderDetail();
  });
}

function paneContact(p){
  const tpl=getTpl(p.templateId);
  const roles=tpl?.contactRoles||[];

  roles.forEach(role=>{
    const contact=contacts.find(c=>c.roleId===role.id)||{roleId:role.id,roleName:role.label,data:{}};
    const d=contact.data||{};
    const hasData=role.fields.some(f=>d[f.id]);
    h+=`<div style="margin-bottom:14px">

// BIND EVENTS
let _psDragFrom=null;
function bindPaneEvents(p){
  const pane=document.getElementById('d-pane');
  pane.querySelectorAll('.proj-stage-item[draggable]').forEach(el=>{
    el.addEventListener('dragstart',()=>{_psDragFrom=parseInt(el.dataset.si);el.style.opacity='.4';});
    el.addEventListener('dragend',()=>{el.style.opacity='1';document.querySelectorAll('.proj-stage-item').forEach(x=>x.classList.remove('drag-over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',()=>{
      el.classList.remove('drag-over');if(_psDragFrom===null)return;
      const ps=getProjectStages(p),ids=ps.map(s=>s.id);
      const item=ids.splice(_psDragFrom,1)[0];ids.splice(parseInt(el.dataset.si),0,item);
      p.customStageIds=ids;_psDragFrom=null;save();renderDetail();
    });
  });
  pane.querySelectorAll('[data-action=rename-pstage]').forEach(inp=>{
    inp.addEventListener('change',()=>{const gs=G.stages.find(s=>s.id===inp.dataset.sid);if(gs){gs.name=inp.value.trim()||gs.name;save();}});
  });
  pane.querySelectorAll('[data-action=rename-cl-sec]').forEach(inp=>{
    inp.addEventListener('change',()=>{const si=parseInt(inp.dataset.si);if(p.checklist[si]){p.checklist[si].section=inp.value.trim()||p.checklist[si].section;save();}});
  });
  pane.querySelectorAll('[data-action]').forEach(el=>{
    if(el.tagName==='INPUT')return;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const a=el.dataset.action,si=parseInt(el.dataset.si),ii=parseInt(el.dataset.ii),i=parseInt(el.dataset.i);
      if(a==='toggle-cl'){p.checklist[si].items[ii].done=!p.checklist[si].items[ii].done;p.checklist[si].items[ii].doneDate=p.checklist[si].items[ii].done?TODAY:'';save();renderDetail();}
      if(a==='add-cl')openAddClItem(p.id,si);
      if(a==='edit-cl')openEditClItem(p.id,si,ii);
      if(a==='rm-cl'){if(!confirm('刪除？'))return;p.checklist[si].items.splice(ii,1);save();renderDetail();}
      if(a==='add-cl-sec')openAddClSec(p.id);
      if(a==='toggle-todo'){p.todos[i].done=!p.todos[i].done;save();renderDetail();}
      if(a==='add-todo')openTodoModal(p.id,null);
      if(a==='edit-todo')openTodoModal(p.id,i);
      if(a==='rm-todo'){p.todos.splice(i,1);save();renderDetail();}
      if(a==='add-log')openLogModal(p.id,null);
      if(a==='edit-log')openLogModal(p.id,i);
      if(a==='rm-log'){if(!confirm('刪除？'))return;p.logs.splice(i,1);save();renderDetail();}
      if(a==='add-note')openNoteModal(p.id,null);
      if(a==='edit-note')openNoteModal(p.id,i);
      if(a==='rm-note'){if(!confirm('刪除？'))return;p.notes.splice(i,1);save();renderDetail();}
      if(a==='lightbox'){document.getElementById('lb-img').src=el.dataset.src;document.getElementById('lightbox').classList.add('open');}
      if(a==='dl-file'){const a2=document.createElement('a');a2.href=el.dataset.src;a2.download=el.dataset.name;a2.click();}
      if(a==='rm-pstage'){const ps=getProjectStages(p);p.customStageIds=ps.filter(s=>s.id!==el.dataset.sid).map(s=>s.id);save();renderDetail();}
      if(a==='add-pstage'){const ps=getProjectStages(p);p.customStageIds=[...ps.map(s=>s.id),el.dataset.sid];save();renderDetail();}
      if(a==='add-custom-stage')openAddCustomStageModal(p.id);
      if(a==='reset-pstages'){p.customStageIds=[];save();renderDetail();}
      if(a==='edit-contact')openContactModal(p.id,el.dataset.role);
      if(a==='add-proj-field')openAddProjFieldModal(p.id);
    });
  });
}

// REMIND BEFORE
function remindBeforeHTML(rn,ru){
  const opts=[
    {v:'',l:'不提前提醒'},
    {v:'5|min',l:'5 分鐘前'},{v:'10|min',l:'10 分鐘前'},{v:'15|min',l:'15 分鐘前'},
    {v:'30|min',l:'30 分鐘前'},{v:'60|min',l:'1 小時前'},{v:'120|min',l:'2 小時前'},
    {v:'24|hr',l:'1 天前'},{v:'48|hr',l:'2 天前'}
  ];
  const cur=rn?(rn+'|'+(ru||'min')):'';
  return '<div class="form-row"><label class="form-label">提前提醒</label>'
    +'<select id="m-remind-sel">'
    +opts.map(o=>'<option value="'+o.v+'"'+(cur===o.v||(!cur&&!o.v)?' selected':'')+'>'+o.l+'</option>').join('')
    +'</select></div>';
}
function getRemindVals(){
  const sel=document.getElementById('m-remind-sel');
  if(!sel||!sel.value)return{n:'',u:'min'};
  const parts=sel.value.split('|');
  return{n:parts[0]||'',u:parts[1]||'min'};
}

function saveProjForm(isEdit,oldP,tpl){
  const name=document.getElementById('pf-name').value.trim();if(!name)return alert('請輸入專案名稱');
  const selCerts=[...document.querySelectorAll('#pf-certs .topt.sel')].map(b=>b.textContent.trim());
  const selAttrs=[...document.querySelectorAll('#pf-attrs .topt.sel')].map(b=>b.textContent.trim());

  if(isEdit&&oldP.projCustomFields)oldP.projCustomFields.forEach(f=>{if(oldP.customFields&&oldP.customFields[f.id]!==undefined)cf[f.id]=oldP.customFields[f.id];});
  const contacts=[];
  (tpl?.contactRoles||[]).forEach(role=>{
    const d={};role.fields.forEach(f=>{const el=document.getElementById(role.id+'-'+f.id);if(el)d[f.id]=el.value||'';});
    contacts.push({roleId:role.id,roleName:role.label,data:d});
  });
  const rv=getRemindVals();
  const proj={id:isEdit?oldP.id:Date.now(),name,stage:_selStage||G.stages[0]?.id,certs:selCerts,attrs:selAttrs,
    followup:document.getElementById('pf-fu').value||'',followupTime:document.getElementById('pf-fu-time').value||'',
    remindBeforeN:rv.n,remindBeforeUnit:rv.u,contactDate:document.getElementById('pf-contact').value||TODAY,
    price:autoPrice||document.getElementById('pf-price').value||'',source:document.getElementById('pf-source').value||'',
    year:parseInt(document.getElementById('pf-year').value)||new Date().getFullYear(),
    month:parseInt(document.getElementById('pf-month').value)||1,
    templateId:_selTpl,mascot:isEdit?oldP.mascot:randMascot(),
    status:isEdit?oldP.status:'active',closedDate:isEdit?oldP.closedDate:'',lostDate:isEdit?oldP.lostDate:'',
    customStageIds:isEdit?oldP.customStageIds:[],customFields:cf,projCustomFields:isEdit?(oldP.projCustomFields||[]):[],
    contacts,todos:isEdit?oldP.todos:[],checklist:isEdit?oldP.checklist:buildCL(_selTpl),
    notes:isEdit?oldP.notes:[],logs:isEdit?oldP.logs:[]};
  if(isEdit){const idx=G.projects.findIndex(x=>x.id===oldP.id);G.projects[idx]=proj;}
  else G.projects.push(proj);

function exportBackup(){
  const data=JSON.stringify(G,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='worknest-backup-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
}
function importBackup(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.projects)return alert('無效的備份檔案');
      if(!confirm('確定要匯入？這將覆蓋現有資料。'))return;
      G=data;save();renderYearFilter();renderStats();renderAlerts();renderFilterBar();renderProjects();renderSettings();
      alert('匯入成功！共 '+G.projects.length+' 個專案');
    }catch(e){alert('檔案格式錯誤');}
  };
  reader.readAsText(file);
  inp.value='';
}

function buildCL(tplId){
  const t=getTpl(tplId);if(!t)return[];
  return(t.checklist||[]).map(s=>({section:s.section,items:(s.items||[]).map(i=>({...i,done:false,doneDate:'',note:''}))}));
}

function initDiary(){
  const to=TODAY,from=new Date(Date.now()-29*86400000).toISOString().split('T')[0];
  document.getElementById('diary-from').value=from;document.getElementById('diary-to').value=to;renderDiary();
}
function renderDiary(){
  const from=document.getElementById('diary-from').value,to=document.getElementById('diary-to').value;
  const kw=(document.getElementById('diary-kw').value||'').toLowerCase();
  const res=[];
  G.projects.forEach(p=>p.logs.forEach(l=>{
    if(from&&l.date<from)return;if(to&&l.date>to)return;
    if(kw&&!l.content.toLowerCase().includes(kw)&&!p.name.toLowerCase().includes(kw))return;
    res.push({...l,pName:p.name,pId:p.id});
  }));
  res.sort((a,b)=>b.date.localeCompare(a.date));
  if(!res.length){document.getElementById('diary-result').innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><p>找不到紀錄</p></div>';return;}
  const dg={};res.forEach(r=>{(dg[r.date]=dg[r.date]||[]).push(r);});
  let html='';
  Object.keys(dg).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    html+=`<div class="dg-header">📅 ${date}</div>`;
    dg[date].forEach(r=>{
      html+=`<div class="diary-item">
        <div class="diary-proj" data-pid="${r.pId}">📋 ${escHtml(r.pName)}</div>
        <div style="font-size:13px;line-height:1.6">${escHtml(r.content)}</div>
        ${r.attrs&&r.attrs.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">${r.attrs.map(a=>`<span class="badge badge-attr">${escHtml(a)}</span>`).join('')}</div>`:''}
      </div>`;
    });
  });
  document.getElementById('diary-result').innerHTML=html;
  document.querySelectorAll('.diary-proj').forEach(el=>el.addEventListener('click',()=>{goPage('projects');openProject(parseInt(el.dataset.pid));}));
}

// STATS PAGE
function renderRevenue(){
  const selYear=document.getElementById('rev-year')?.value||'';
  const selMonth=document.getElementById('rev-month')?.value||'';
  const selStatus=document.getElementById('rev-status')?.value||'';
  if(!G.revenueBaselines)G.revenueBaselines=Array(12).fill(0);
  const bls=G.revenueBaselines;
  const getAmt=p=>{
    if(p.certPrices&&p.certPrices.length)return p.certPrices.reduce((s,cp)=>s+(parseFloat(String(cp.amount||'0').replace(/,/g,''))||0),0);
    return parseFloat(String(p.price||'0').replace(/,/g,''))||0;
  };
  const projs=G.projects.filter(p=>{
    if(selYear&&String(p.year||new Date().getFullYear())!==selYear)return false;
    if(selMonth&&String(p.month||1)!==selMonth)return false;
    if(selStatus&&p.status!==selStatus)return false;
    return true;
  });
  const fmtN=n=>n>=10000?(n/10000).toFixed(1)+'萬':n.toLocaleString();
  const totalAmt=projs.reduce((s,p)=>s+getAmt(p),0);
  const activeAmt=projs.filter(p=>p.status==='active').reduce((s,p)=>s+getAmt(p),0);
  const closedAmt=projs.filter(p=>p.status==='closed').reduce((s,p)=>s+getAmt(p),0);
  const lostAmt=projs.filter(p=>p.status==='lost').reduce((s,p)=>s+getAmt(p),0);
  // Chart
  const chartYear=parseInt(selYear)||new Date().getFullYear();
  const monthlyData=Array.from({length:12},(_,i)=>{
    const m=i+1;
    const ps=G.projects.filter(p=>(p.year||new Date().getFullYear())===chartYear&&(p.month||1)===m);
    return{month:m,amount:ps.reduce((s,p)=>s+getAmt(p),0)};
  });
  const maxVal=Math.max(...monthlyData.map(d=>d.amount),...bls,100000);
  const W=560,H=200,pl=65,pr=15,pt=20,pb=40;
  const cW=W-pl-pr,cH=H-pt-pb;
  const cx=i=>pl+i*(cW/11);
  const cy=v=>pt+cH-(v/maxVal*cH);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
  [0.25,0.5,0.75,1].forEach(r=>{
    const yv=pt+cH-r*cH;
    svg+='<line x1="'+pl+'" y1="'+yv+'" x2="'+(W-pr)+'" y2="'+yv+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>';
    svg+='<text x="'+(pl-5)+'" y="'+(yv+4)+'" text-anchor="end" font-size="10" fill="var(--text3)">'+fmtN(maxVal*r)+'</text>';
  });
  monthlyData.forEach((d,i)=>{
    const bl=bls[i]||0;
    const color=d.amount>0&&d.amount>=bl?'var(--sage)':'var(--red)';
    const bH=Math.max(2,d.amount/maxVal*cH);
    svg+='<rect x="'+(cx(i)-11)+'" y="'+cy(d.amount)+'" width="22" height="'+bH+'" fill="'+color+'" opacity=".25" rx="3"/>';
    svg+='<text x="'+cx(i)+'" y="'+(H-pb+14)+'" text-anchor="middle" font-size="10" fill="var(--text3)">'+(i+1)+'月</text>';
    if(d.amount>0)svg+='<text x="'+cx(i)+'" y="'+(cy(d.amount)-5)+'" text-anchor="middle" font-size="9" fill="'+color+'" font-weight="700">'+fmtN(d.amount)+'</text>';
  });
  const blPts=bls.map((_,i)=>cx(i)+','+cy(bls[i])).join(' ');
  svg+='<polyline points="'+blPts+'" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,3" opacity=".8"/>';
  const aPts=monthlyData.map((_,i)=>cx(i)+','+cy(monthlyData[i].amount)).join(' ');
  svg+='<polyline points="'+aPts+'" fill="none" stroke="var(--sage)" stroke-width="2.5"/>';
  monthlyData.forEach((d,i)=>{
    const bl=bls[i]||0;
    const color=d.amount>0&&d.amount>=bl?'var(--sage)':'var(--red)';
    svg+='<circle cx="'+cx(i)+'" cy="'+cy(d.amount)+'" r="4" fill="'+color+'" stroke="white" stroke-width="1.5"/>';
  });
  svg+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="var(--border2)" stroke-width="1.5"/>';
  svg+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(H-pb)+'" stroke="var(--border2)" stroke-width="1.5"/>';
  svg+='</svg>';
  // Project list
  let projRows='';
  [...projs].sort((a,b)=>getAmt(b)-getAmt(a)).forEach(p=>{
    const amt=getAmt(p);
    let cpRows='';
    (p.certPrices||[]).forEach(cp=>{
      const a=parseFloat(String(cp.amount||'0').replace(/,/g,''))||0;
      cpRows+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);padding:2px 0 2px 14px"><span>└ '+escHtml(cp.certName||'')+'</span><span>NT$ '+a.toLocaleString()+'</span></div>';
    });
    projRows+='<div style="background:var(--white);border-radius:var(--rsm);border:1.5px solid var(--border);padding:10px 13px;margin-bottom:7px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-size:13px;font-weight:800;cursor:pointer;color:var(--text)" onclick="goPage('projects');openProject('+p.id+')">'+escHtml(p.name)+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+(p.year||'')+'年'+(p.month||'')+'月 · '+(p.status==='closed'?'✅ 結案':p.status==='lost'?'❌ 流標':'🌱 進行中')+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:var(--sage)">NT$ '+amt.toLocaleString()+'</div>'
      +'<button class="btn btn-sm btn-ghost" style="font-size:11px;margin-top:3px" onclick="openCertPrices('+p.id+')">✏️ 分項報價</button></div></div>'+cpRows+'</div>';
  });
  const el=document.getElementById('rev-content');if(!el)return;
  el.innerHTML='<div class="stat-row">'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--blue)">NT$ '+fmtN(totalAmt)+'</div><div class="stat-label">📊 篩選總報價</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--sage)">NT$ '+fmtN(activeAmt)+'</div><div class="stat-label">🌱 進行中</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--gray)">NT$ '+fmtN(closedAmt)+'</div><div class="stat-label">✅ 結案</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--red)">NT$ '+fmtN(lostAmt)+'</div><div class="stat-label">❌ 流標</div></div>'
    +'</div>'
    +'<div class="analytics-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<div class="analytics-title" style="margin-bottom:0">📈 月度報價趨勢（'+chartYear+'年）</div>'
    +'<button class="btn btn-sm" onclick="openBaselineEditor()">⚙️ 設定月目標</button></div>'+svg+'</div>'
    +'<div class="analytics-card"><div class="analytics-title">💰 專案報價明細</div>'+(projRows||'<div class="empty-state"><div class="empty-icon">💰</div><p>無符合條件的專案</p></div>')+'</div>';
}

    let h='';

        +'<button class="btn btn-sm btn-danger" onclick="rmCP('+pid+','+i+')">✕</button></div>';

  let h=`<div class="set-card"><div class="set-title">🗂️ 工作階段（全局公版）</div><div class="set-hint">拖曳調整順序，每個專案可在「階段」分頁獨立調整</div><div id="drag-stages">`;
  G.stages.forEach((s,i)=>{
    h+=`<div class="drag-item" draggable="true" data-i="${i}"><span class="drag-handle">⠿</span><span class="color-dot" style="background:${s.color}"></span><span style="flex:1;font-size:13px;font-weight:700">${escHtml(s.name)}</span><span style="font-size:11px;color:var(--text3);padding:2px 8px;background:var(--bg2);border-radius:20px">${i+1}</span><button class="pill-rm" data-rm-stage="${s.id}">✕</button></div>`;
  });
  h+=`</div><div class="add-row"><input type="text" id="add-stage-inp" placeholder="新增階段名稱"><button class="btn btn-sm" id="btn-add-stage">＋ 新增</button></div></div>`;
  h+=mkTagCard('🏷️ 任務屬性',G.attrs,'attrs','add-attr-inp','btn-add-attr');
  h+=mkTagCard('🏅 認證類型',G.certs,'certs','add-cert-inp','btn-add-cert');
  h+=mkTagCard('📌 待辦類型',G.todoOpts,'todoOpts','add-todo-inp','btn-add-todo');
  h+=`<div class="set-card"><div class="set-title">💾 資料備份</div>
    <div class="set-hint">匯出資料備份或從備份檔案還原</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm btn-p" onclick="exportBackup()">📤 匯出備份</button>
      <button class="btn btn-sm" onclick="document.getElementById('import-file').click()">📥 匯入備份</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importBackup(this)">
    </div></div>`;
  h+=`<div class="set-card"><div class="set-title">📐 公版管理</div><div class="set-hint">公版決定新增專案時的預設階段、欄位與清單</div><div id="tpl-list">`;
  G.templates.forEach(t=>{
    h+=`<div class="tpl-card" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><div class="tpl-name">${t.icon} ${escHtml(t.name)}</div><div style="display:flex;gap:4px"><button class="btn btn-sm" data-edit-tpl="${t.id}">✏️ 編輯</button><button class="btn btn-sm" data-copy-tpl="${t.id}">📋 複製</button>${G.templates.length>1?`<button class="btn btn-sm" data-rm-tpl="${t.id}" style="color:var(--red)">✕</button>`:''}</div></div></div>`;
  });
  h+=`</div><button class="btn btn-sm btn-p" id="btn-new-tpl" style="margin-top:8px">＋ 新增公版</button></div>`;
  document.getElementById('settings-content').innerHTML=h;
  document.querySelectorAll('#drag-stages .drag-item').forEach(el=>{
    el.addEventListener('dragstart',()=>_dragFrom=parseInt(el.dataset.i));
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',()=>{
      if(_dragFrom===null||_dragFrom===parseInt(el.dataset.i))return;
      const item=G.stages.splice(_dragFrom,1)[0];G.stages.splice(parseInt(el.dataset.i),0,item);
      _dragFrom=null;save();renderSettings();renderFilterBar();
    });
  });
  document.querySelectorAll('[data-rm-stage]').forEach(btn=>btn.addEventListener('click',()=>{
    if(G.projects.some(p=>p.stage===btn.dataset.rmStage))return alert('有專案使用此階段，無法刪除');
    G.stages=G.stages.filter(s=>s.id!==btn.dataset.rmStage);save();renderSettings();renderFilterBar();
  }));
  document.getElementById('btn-add-stage').addEventListener('click',()=>{
    const v=document.getElementById('add-stage-inp').value.trim();if(!v||G.stages.some(s=>s.name===v))return;
    G.stages.push({id:'s'+Date.now(),name:v,color:COLORS[G.stages.length%COLORS.length]});
    document.getElementById('add-stage-inp').value='';save();renderSettings();renderFilterBar();
  });
  document.querySelectorAll('[data-rm-tag]').forEach(btn=>btn.addEventListener('click',()=>{G[btn.dataset.field]=G[btn.dataset.field].filter(x=>x!==btn.dataset.rmTag);save();renderSettings();}));
  ['attr','cert','todo'].forEach(k=>{
    const field=k==='attr'?'attrs':k==='cert'?'certs':'todoOpts';
    document.getElementById(`btn-add-${k}`).addEventListener('click',()=>{
      const inp=document.getElementById(`add-${k}-inp`);const v=inp.value.trim();if(!v||G[field].includes(v))return;
      G[field].push(v);inp.value='';save();renderSettings();
    });
  });
  document.querySelectorAll('[data-edit-tpl]').forEach(btn=>btn.addEventListener('click',()=>openEditTpl(btn.dataset.editTpl)));
  document.querySelectorAll('[data-copy-tpl]').forEach(btn=>btn.addEventListener('click',()=>copyTemplate(btn.dataset.copyTpl)));
  document.querySelectorAll('[data-rm-tpl]').forEach(btn=>btn.addEventListener('click',()=>{if(!confirm('確定刪除？'))return;G.templates=G.templates.filter(t=>t.id!==btn.dataset.rmTpl);save();renderSettings();}));
  document.getElementById('btn-new-tpl').addEventListener('click',openNewTpl);
}

function mkTagCard(title,arr,field,inpId,btnId){
  return `<div class="set-card"><div class="set-title">${title}</div>
    <div>${arr.map(x=>`<span class="tag-pill">${escHtml(x)}<button class="pill-rm" data-rm-tag="${escHtml(x)}" data-field="${field}">✕</button></span>`).join('')}</div>
    <div class="add-row"><input type="text" id="${inpId}" placeholder="新增項目"><button class="btn btn-sm" id="${btnId}">＋</button></div>
  </div>`;
}

function copyTemplate(id){
  const src=G.templates.find(x=>x.id===id);if(!src)return;
  const copy=JSON.parse(JSON.stringify(src));
  copy.id='tpl'+Date.now();copy.name=copy.name+' (副本)';
  G.templates.push(copy);save();renderSettings();
}

function openNewTpl(){
  openModal('新增公版',`<div class="form-row"><label class="form-label">公版名稱</label><input type="text" id="m-tpl-name" placeholder="例：雜項任務"></div><div class="form-row"><label class="form-label">圖示</label><input type="text" id="m-tpl-icon" value="📄" style="width:80px"></div>`,
  ()=>{const name=document.getElementById('m-tpl-name').value.trim();if(!name)return;
    G.templates.push({id:'tpl'+Date.now(),name,icon:document.getElementById('m-tpl-icon').value||'📄',stageIds:G.stages.slice(0,3).map(s=>s.id),customFields:[],contactRoles:[{id:'cr1',label:'客戶',fields:[{id:'cf1',label:'姓名'},{id:'cf2',label:'職稱'},{id:'cf3',label:'部門'},{id:'cf4',label:'電話'},{id:'cf5',label:'信箱'}]}],checklist:[{section:'工作清單',items:[]}]});
    save();closeModal();renderSettings();});
}

function openEditTpl(id){
  const t=G.templates.find(x=>x.id===id);
  const cfH=(t.customFields||[]).map((f,i)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="text" value="${escHtml(f.label)}" id="tpl-cf-${i}" style="flex:1"><button class="btn btn-sm" data-rm-cf="${i}">✕</button></div>`).join('');
  const crH=(t.contactRoles||[]).map((r,ri)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="text" value="${escHtml(r.label)}" id="tpl-cr-${ri}" style="flex:1"><button class="btn btn-sm" data-rm-cr="${ri}">✕</button></div>`).join('');
  openModal(`編輯公版：${escHtml(t.name)}`,`
    <div class="form-row"><label class="form-label">公版名稱</label><input type="text" id="m-tpl-name" value="${escHtml(t.name)}"></div>
    <div class="form-row"><label class="form-label">圖示</label><input type="text" id="m-tpl-icon" value="${t.icon}" style="width:80px"></div>
    <div class="form-row"><label class="form-label">自訂資訊欄位</label><div id="tpl-cf-list">${cfH}</div><div class="add-row"><input type="text" id="new-cf-inp" placeholder="新欄位名稱"><button class="btn btn-sm" id="btn-add-cf">＋</button></div></div>
    <div class="form-row"><label class="form-label">聯絡人角色</label><div id="tpl-cr-list">${crH}</div><div class="add-row"><input type="text" id="new-cr-inp" placeholder="例：業主代理人"><button class="btn btn-sm" id="btn-add-cr">＋</button></div></div>`,
  ()=>{
    t.name=document.getElementById('m-tpl-name').value.trim()||t.name;t.icon=document.getElementById('m-tpl-icon').value||t.icon;
    (t.customFields||[]).forEach((f,i)=>{const el=document.getElementById('tpl-cf-'+i);if(el)f.label=el.value.trim()||f.label;});
    (t.contactRoles||[]).forEach((r,ri)=>{const el=document.getElementById('tpl-cr-'+ri);if(el)r.label=el.value.trim()||r.label;});
    save();closeModal();renderSettings();
  });
  setTimeout(()=>{
    document.getElementById('btn-add-cf').addEventListener('click',()=>{const v=document.getElementById('new-cf-inp').value.trim();if(!v)return;t.customFields=t.customFields||[];t.customFields.push({id:'f'+Date.now(),label:v,type:'text'});save();closeModal();openEditTpl(id);});
    document.getElementById('btn-add-cr').addEventListener('click',()=>{const v=document.getElementById('new-cr-inp').value.trim();if(!v)return;t.contactRoles=t.contactRoles||[];t.contactRoles.push({id:'cr'+Date.now(),label:v,fields:[{id:'cf1',label:'姓名'},{id:'cf2',label:'職稱'},{id:'cf3',label:'部門'},{id:'cf4',label:'電話'},{id:'cf5',label:'信箱'}]});save();closeModal();openEditTpl(id);});
    document.querySelectorAll('[data-rm-cf]').forEach(btn=>btn.addEventListener('click',()=>{t.customFields.splice(parseInt(btn.dataset.rmCf),1);save();closeModal();openEditTpl(id);}));
    document.querySelectorAll('[data-rm-cr]').forEach(btn=>btn.addEventListener('click',()=>{t.contactRoles.splice(parseInt(btn.dataset.rmCr),1);save();closeModal();openEditTpl(id);}));
  },50);
}

// MODAL
function buildCPRows(cps){
  return cps.map((cp,i)=>'<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px" id="cpr-'+i+'">'
    +'<input type="text" class="cp-name-inp" data-idx="'+i+'" value="'+escH(cp.certName||'')+'" placeholder="認證名稱">'
    +'<input type="text" class="cp-amt-inp" data-idx="'+i+'" value="'+(cp.amount||'')+'" placeholder="金額（NT$）">'
    +'<button class="btn btn-sm btn-danger" onclick="rmCPRow('+i+')">✕</button></div>').join('');
}

function addCPRow(){
  const name=document.getElementById('cp-new-name')?.value?.trim();if(!name)return;
  const amt=document.getElementById('cp-new-amt')?.value?.trim()||'';
  const wrap=document.getElementById('cp-rows-wrap');if(!wrap)return;
  const i=wrap.querySelectorAll('[id^="cpr-"]').length;
  const div=document.createElement('div');div.id='cpr-'+i;div.style.cssText='display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px';
  div.innerHTML='<input type="text" class="cp-name-inp" data-idx="'+i+'" value="'+escH(name)+'" placeholder="認證名稱"><input type="text" class="cp-amt-inp" data-idx="'+i+'" value="'+escH(amt)+'" placeholder="金額（NT$）"><button class="btn btn-sm btn-danger" onclick="rmCPRow('+i+')">✕</button>';
  wrap.appendChild(div);
  document.getElementById('cp-new-name').value='';document.getElementById('cp-new-amt').value='';
}
function rmCPRow(i){const row=document.getElementById('cpr-'+i);if(row)row.remove();}

function openModal(title,body,onOK){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=`<button class="btn" id="modal-cancel">取消</button><button class="btn btn-p" id="modal-ok">儲存</button>`;
  document.getElementById('modal-ov').classList.add('open');
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-ok').addEventListener('click',onOK);
}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');_tmpFiles=[];}
function toggleDark(){
  const on=document.documentElement.getAttribute('data-dark')==='1';
  if(on){document.documentElement.removeAttribute('data-dark');localStorage.removeItem('wn_dark');}
  else{document.documentElement.setAttribute('data-dark','1');localStorage.setItem('wn_dark','1');}
  updateDarkToggle();
}
function updateDarkToggle(){
  const on=document.documentElement.getAttribute('data-dark')==='1';
  const t=document.getElementById('dark-toggle'),k=document.getElementById('dark-knob');
  if(!t)return;
  t.style.background=on?'var(--sage)':'var(--border2)';
  if(k)k.style.left=on?'18px':'2px';
}

// ALARM
let _alarmTimer=null;
const _dismissedAlarms=new Set(JSON.parse(localStorage.getItem('wn_shown_alarms')||'[]'));
const _shownAlarms=new Set([..._dismissedAlarms]);
function getRemindMs(n,u){if(!n)return 0;return parseInt(n)*(u==='hr'?3600000:60000);}
function getTriggerTime(followup,followupTime,rn,ru){
  if(!followup||!followupTime)return null;
  const base=new Date(followup+'T'+followupTime);
  return new Date(base.getTime()-getRemindMs(rn,ru));
}
function scheduleAlarmCheck(){if(_alarmTimer)clearInterval(_alarmTimer);_alarmTimer=setInterval(checkAlarms,20000);checkAlarms();}
function checkAlarms(){
  const now=new Date();
  const items=[];
  G.projects.forEach(p=>{
    if(p.followup&&p.followupTime&&p.status==='active'){
      const trigger=getTriggerTime(p.followup,p.followupTime,p.remindBeforeN,p.remindBeforeUnit);
      if(trigger){const diff=(trigger-now)/60000;const aid='proj-'+p.id+'-'+p.followup+p.followupTime;
        if(diff<=1&&!_shownAlarms.has(aid))items.push({id:aid,label:'專案追蹤',proj:p.name});}
    }
    (p.todos||[]).filter(t=>!t.done&&t.followup&&t.followupTime).forEach(t=>{
      const trigger=getTriggerTime(t.followup,t.followupTime,t.remindBeforeN,t.remindBeforeUnit);
      if(trigger){const diff=(trigger-now)/60000;const aid='todo-'+t.id;
        if(diff<=1&&!_shownAlarms.has(aid))items.push({id:aid,label:t.label,proj:p.name});}
    });
    (p.logs||[]).filter(l=>l.followup&&l.followupTime).forEach(l=>{
      const trigger=getTriggerTime(l.followup,l.followupTime,l.remindBeforeN,l.remindBeforeUnit);
      if(trigger){const diff=(trigger-now)/60000;const aid='log-'+l.id;
        if(diff<=1&&!_shownAlarms.has(aid))items.push({id:aid,label:'日誌追蹤：'+l.content.slice(0,20),proj:p.name});}
    });
  });
  items.forEach(item=>{_shownAlarms.add(item.id);showAlarmPopup(item);});
}
function showAlarmPopup(item){
  const container=document.getElementById('alarm-container');
  const mascot=ALARM_MASCOTS[Math.floor(Math.random()*ALARM_MASCOTS.length)];
  const uid='ap'+Date.now()+Math.floor(Math.random()*9999);
  const div=document.createElement('div');div.className='alarm-popup';div.id=uid;
  div.innerHTML=`<div class="alarm-top"><span class="alarm-mascot">${mascot}</span></div>
    <div class="alarm-body">
      <div class="alarm-title">⏰ 提醒時間到了！</div>
      <div class="alarm-msg"><b>${escHtml(item.proj)}</b><br>📌 ${escHtml(item.label)}</div>
      <div class="alarm-btns">
        <button class="alarm-ok" onclick="dismissAlarm('${uid}')">✓ 知道了</button>
        <button class="alarm-snooze" onclick="toggleSnooze('${uid}')">⏰ 延後</button>
      </div>
      <div class="snooze-panel" id="sp-${uid}">
        <button class="snooze-opt" onclick="doSnooze('${uid}',10)">10分後</button>
        <button class="snooze-opt" onclick="doSnooze('${uid}',30)">30分後</button>
        <button class="snooze-opt" onclick="doSnooze('${uid}',60)">1小時後</button>
        <div style="display:flex;gap:4px;align-items:center;width:100%;margin-top:4px">
          <input type="number" min="1" max="999" placeholder="自訂" style="width:65px;padding:4px 7px;font-size:12px" id="sn-n-${uid}">
          <select style="font-size:12px;padding:4px" id="sn-u-${uid}"><option value="min">分鐘後</option><option value="hr">小時後</option></select>
          <button class="snooze-opt" onclick="doSnoozeCustom('${uid}')">確定</button>
        </div>
      </div>
    </div>`;
  container.appendChild(div);
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dismissAlarm(uid){const el=document.getElementById(uid);if(el){const aid=el.dataset.aid;if(aid){const arr=JSON.parse(localStorage.getItem('wn_shown_alarms')||'[]');if(!arr.includes(aid)){arr.push(aid);localStorage.setItem('wn_shown_alarms',JSON.stringify(arr.slice(-500)));}}el.remove();}}
function toggleSnooze(uid){const sp=document.getElementById('sp-'+uid);if(sp)sp.style.display=sp.style.display==='flex'?'none':'flex';}
function doSnooze(uid,mins){
  const proj=document.getElementById(uid)?.querySelector('.alarm-msg b')?.textContent||'';
  const label=document.getElementById(uid)?.querySelector('.alarm-msg')?.lastChild?.textContent?.replace('📌 ','')||'延後的提醒';
  dismissAlarm(uid);
  setTimeout(()=>showAlarmPopup({id:'snz'+Date.now(),label,proj}),mins*60000);
}
function doSnoozeCustom(uid){
  const n=parseInt(document.getElementById('sn-n-'+uid)?.value)||10;
  const u=document.getElementById('sn-u-'+uid)?.value||'min';
  const proj=document.getElementById(uid)?.querySelector('.alarm-msg b')?.textContent||'';
  dismissAlarm(uid);
  setTimeout(()=>showAlarmPopup({id:'snz'+Date.now(),label:'延後的提醒',proj}),getRemindMs(n,u));
}

// INIT
document.addEventListener('DOMContentLoaded',function(){
  if(localStorage.getItem('wn_dark')==='1'){document.documentElement.setAttribute('data-dark','1');}
  // Try to load from Firestore
  if(typeof DOC_REF!=='undefined'){
    DOC_REF.get().then(doc=>{
      if(doc.exists){const d=doc.data();if(d&&d.projects){G=d;if(!G.tabOrder)G.tabOrder=['info','contact','stages','checklist','todos','logs','notes'];
if(!G.revenueBaselines)G.revenueBaselines=Array(12).fill(0);
G.projects.forEach(p=>{if(!p.certPrices)p.certPrices=[];});localStorage.setItem('zz5_data',JSON.stringify(G));}}
      init();
    }).catch(()=>init());
  } else { init(); }
  function init(){
  document.getElementById('nav-projects').addEventListener('click',()=>goPage('projects'));
  document.getElementById('nav-stats').addEventListener('click',()=>goPage('stats'));
  document.getElementById('nav-diary').addEventListener('click',()=>goPage('diary'));
  document.getElementById('nav-today').addEventListener('click',()=>goPage('today'));
  document.getElementById('nav-revenue').addEventListener('click',()=>goPage('revenue'));
  document.getElementById('rev-filter-btn').addEventListener('click',renderRevenue);
  document.getElementById('nav-settings').addEventListener('click',()=>goPage('settings'));
  document.getElementById('btn-new-proj').addEventListener('click',openNewProjModal);
  document.getElementById('proj-search').addEventListener('input',renderProjects);
  document.getElementById('filter-year').addEventListener('change',renderProjects);
  document.getElementById('filter-month').addEventListener('change',renderProjects);
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('modal-ov').addEventListener('click',function(e){if(e.target===this)closeModal();});
  document.getElementById('diary-search-btn').addEventListener('click',renderDiary);
  document.getElementById('diary-clear-btn').addEventListener('click',()=>{document.getElementById('diary-from').value='';document.getElementById('diary-to').value='';document.getElementById('diary-kw').value='';renderDiary();});
  document.getElementById('stats-filter-btn').addEventListener('click',renderStatsPage);
  document.getElementById('lightbox').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lb-close').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('open'));
  renderYearFilter();renderStats();renderAlerts();renderFilterBar();renderProjects();scheduleAlarmCheck();updateDarkToggle();
  }
  // Try Firebase, fall back to localStorage
  try{
    if(typeof firebase!=='undefined'&&typeof DOC_REF!=='undefined'){
      DOC_REF.get().then(doc=>{if(doc.exists){const d=doc.data();if(d&&d.projects){G=d;if(!G.tabOrder)G.tabOrder=['info','contact','stages','checklist','todos','logs','notes'];localStorage.setItem('zz5_data',JSON.stringify(G));}}startAll();}).catch(startAll);
    }else{startAll();}
  }catch(e){startAll();}
});
</script>
